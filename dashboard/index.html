<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — GATE DA | hellogaurav.me</title><meta name="description" content="Your GATE DA dashboard: syllabus completion, accuracy, mocks, weak topics, revision due — from your real browser data."><link rel="canonical" href="https://hellogaurav.me/dashboard"><link rel="stylesheet" href="../assets/seo.css"><style>body{font-family:Georgia,serif;max-width:960px;margin:0 auto;padding:24px 18px 60px;background:#0a0a0a;color:#f5f3ee;line-height:1.6}h1,h2{font-family:Arial,sans-serif}a{color:#e2601f}nav{font-family:Arial;font-size:13px;margin-bottom:16px}nav a{margin-right:12px;color:#f5f3ee}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #333;border-radius:12px;padding:14px;background:#111}</style></head><body><nav><a href="../index.html">Home</a><a href="../syllabus">Syllabus</a><a href="../learn/calculus">Learn</a><a href="../practice-da">Practice</a><a href="../mock-da">Mocks</a><a href="../revision">Revision</a><a href="../planner">Planner</a></nav><h1>Dashboard</h1><p id="empty">Loading your local progress…</p><div class="grid"><div class="card"><h2>Syllabus</h2><p id="syl">—</p></div><div class="card"><h2>Practice</h2><p id="pr">—</p></div><div class="card"><h2>Mocks</h2><p id="mk">—</p></div><div class="card"><h2>Revision due</h2><p id="rev">—</p></div></div><h2>Recommended next</h2><p id="next"></p><script src="../assets/gateda.js"></script><script>GateDALoad().then(function(d){var tot=0,done=0,weak=[],due=[];d.subjects.forEach(function(s){s.topics.forEach(function(t){tot++;var st=GateDA.topicState(t.id);if(st.status==="practiced"||st.status==="mastered")done++;if(st.confidence<=2&&st.lastStudied)weak.push(s.title+" / "+t.id);if(st.status==="revision-needed")due.push(t.id)})});document.getElementById("syl").textContent=done+"/"+tot+" topics ("+Math.round(100*done/Math.max(1,tot))+"%)";var at=GateDA.attempts();var ok=at.filter(function(a){return a.correct}).length;document.getElementById("pr").textContent=at.length?at.length+" attempted, "+Math.round(100*ok/at.length)+"% correct":"No attempts yet — start at Practice.";var mk=GateDA.mocks();document.getElementById("mk").textContent=mk.length?mk.length+" mocks, last score "+mk[mk.length-1].score+" / "+mk[mk.length-1].total:"No mocks yet.";document.getElementById("rev").textContent=due.length?due.slice(0,8).join(", "):"Nothing flagged — mark topics revision-needed in Syllabus.";var rec=null;d.subjects.forEach(function(s){s.topics.forEach(function(t){if(!rec&&GateDA.topicState(t.id).status==="not-started")rec=s.title+" → "+t.official})});document.getElementById("next").innerHTML=rec?("Start: <b>"+rec+"</b>"):"All topics started — revise weak areas.";document.getElementById("empty").textContent="All numbers come from this browser only. New here? Open Syllabus, then Learn.";if(!at.length&&!mk.length&&!done)document.getElementById("empty").textContent="Empty state: no progress yet. Open Syllabus → pick first Not Started topic → Learn → Practice."})</script></body></html>
