<!DOCTYPE html><html lang="en" data-root=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DA Practice — GATE 2027 (Practice Questions)</title><meta name="description" content="Topic-wise GATE DA practice with MCQ/MSQ/NAT, official marking, solutions. All items are Practice Questions, not PYQs."><link rel="canonical" href="https://hellogaurav.me/practice-da"><meta property="og:title" content="GATE DA Practice"><meta property="og:url" content="https://hellogaurav.me/practice-da"><link rel="stylesheet" href="../assets/seo.css"><link rel="stylesheet" href="../assets/app.css"></head><body>
<main class="app-main" id="main">
  <div class="shell">
    <div class="page-head">
      <p class="eyebrow">Practice</p>
      <h1>Practice questions</h1>
      <p class="lede">Every item is a <b>Practice Question</b> (platform-authored) — no PYQs are claimed. Marking follows GATE DA: MCQ 1-mark −⅓, 2-mark −⅔; MSQ/NAT carry no negative marking.</p>
    </div>

    <div class="controls">
      <label class="field">Subject
        <select id="sub"><option value="">All</option><option value="calc">Calculus</option><option value="prog">Programming</option><option value="dbms">DBMS</option><option value="ai">AI</option><option value="ga">Aptitude</option></select>
      </label>
      <label class="field">Search
        <input type="search" id="qq" placeholder="Search questions">
      </label>
      <span class="muted" id="count" style="margin-left:auto"></span>
    </div>

    <div id="list"></div>
  </div>
</main>
<script src="../assets/gateda.js"></script>
<script src="../assets/app-shell.js" defer></script>
<script>fetch("../data/practice-da.json").then(function(r){return r.json()}).then(function(d){var box=document.getElementById("list");function prov(x){return '<p class="muted" style="font-size:12.5px;margin:12px 0 0">Provenance: Practice Question (platform-authored v1) · Topic: '+x.topic+'</p>'}function render(){var s=document.getElementById("sub").value,q=document.getElementById("qq").value.toLowerCase();box.innerHTML="";var items=d.questions.filter(function(x){return(!s||x.subject===s)&&(!q||x.q.toLowerCase().indexOf(q)>=0)});document.getElementById("count").textContent=items.length+" question"+(items.length===1?"":"s");if(!items.length){box.innerHTML='<div class="empty"><h3>No questions match</h3><p>Try clearing the subject filter or your search.</p></div>';return}items.forEach(function(x){var el=document.createElement("article");el.className="q";el.innerHTML='<div class="meta"><span class="pill pill--accent">'+x.type.toUpperCase()+'</span><span class="pill">'+x.marks+' mark'+(x.marks>1?"s":"")+'</span>'+(x.topic?'<span class="pill">'+x.topic+'</span>':"")+'</div><p class="stem"><span class="mono muted">'+x.id+'</span> — '+x.q+'</p>';var answered=false;function done(ok,extra){if(answered)return;answered=true;GateDA.logAttempt({qid:x.id,correct:ok,subject:x.subject});var ex=document.createElement("div");ex.className="explain";ex.innerHTML="<b>"+(ok?"Correct.":"Incorrect.")+"</b> "+x.s+(extra||"");el.appendChild(ex);Array.prototype.forEach.call(el.querySelectorAll(".opt"),function(b){b.disabled=true});var chk=el.querySelector("button.check");if(chk)chk.disabled=true;var nat=el.querySelector("input.nat");if(nat)nat.disabled=true}if(x.o){var opts=document.createElement("div");opts.className="opts";var sel=[];x.o.forEach(function(o,i){var b=document.createElement("button");b.type="button";b.className="opt";b.dataset.i=i;b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+"</span><span>"+o+"</span>";b.onclick=function(){if(answered)return;if(x.type==="msq"){var idx=sel.indexOf(i);if(idx>=0){sel.splice(idx,1);b.classList.remove("selected")}else{sel.push(i);b.classList.add("selected")}}else{Array.prototype.forEach.call(opts.children,function(c){c.classList.remove("selected")});b.classList.add("selected");var isAns=(i===x.a);if(isAns){b.classList.add("correct")}else{b.classList.add("wrong");var corr=opts.children[x.a];if(corr)corr.classList.add("correct")}done(isAns)}};opts.appendChild(b)});el.appendChild(opts);if(x.type==="msq"){var row=document.createElement("div");row.className="nat-row";row.style.marginTop="12px";var sub=document.createElement("button");sub.type="button";sub.className="btn btn--primary btn--sm check";sub.textContent="Submit answer";sub.onclick=function(){if(answered)return;if(!sel.length)return;var a=x.a,ok=(sel.length===a.length)&&a.every(function(v){return sel.indexOf(v)>=0});Array.prototype.forEach.call(opts.children,function(c){c.disabled=true;var ci=+c.dataset.i;if(a.indexOf(ci)>=0)c.classList.add("correct");else if(sel.indexOf(ci)>=0)c.classList.add("wrong")});done(ok," Selected: "+sel.map(function(v){return String.fromCharCode(65+v)}).join(", ")+".")};row.appendChild(sub);el.appendChild(row);el.insertAdjacentHTML("beforeend",'<p class="muted" style="font-size:12.5px;margin:10px 0 0">Multi-select: pick the exact set of correct options, then submit.</p>')}}else{var natRow=document.createElement("div");natRow.className="nat-row";var inp=document.createElement("input");inp.type="number";inp.step="any";inp.className="nat";inp.placeholder="Numeric answer";inp.setAttribute("aria-label","Numeric answer");var b=document.createElement("button");b.type="button";b.className="btn btn--primary btn--sm check";b.textContent="Check";b.onclick=function(){if(answered)return;var v=parseFloat(inp.value);if(isNaN(v))return;var ok=v>=x.a[0]&&v<=x.a[1];done(ok,ok?"":" (Accepted range: ["+x.a.join(" … ")+"])")};natRow.appendChild(inp);natRow.appendChild(b);el.appendChild(natRow)}el.insertAdjacentHTML("beforeend",prov(x));box.appendChild(el)})}document.getElementById("sub").value=(new URLSearchParams(location.search).get("subject")||"");document.getElementById("sub").onchange=render;document.getElementById("qq").oninput=render;render()})</script>
</body></html>
