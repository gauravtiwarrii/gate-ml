<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DA Practice — GATE 2027 (Practice Questions)</title><meta name="description" content="Topic-wise GATE DA practice with MCQ/MSQ/NAT, official marking, solutions. All items are Practice Questions, not PYQs."><link rel="canonical" href="https://hellogaurav.me/practice-da"><link rel="stylesheet" href="../assets/seo.css"><style>body{font-family:Georgia,serif;max-width:860px;margin:0 auto;padding:24px 18px 60px;background:#0a0a0a;color:#f5f3ee;line-height:1.6}h1{font-family:Arial,sans-serif}a{color:#e2601f}nav{font-family:Arial;font-size:13px}nav a{margin-right:12px;color:#f5f3ee}.q{border:1px solid #333;border-radius:12px;padding:14px;margin:12px 0;background:#111}button{background:#e2601f;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:4px}input{background:#1a1a1a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px}</style></head><body><nav><a href="../index.html">Home</a><a href="../syllabus">Syllabus</a><a href="../mock-da">Mocks</a><a href="../revision">Revision</a></nav><h1>DA Practice — Practice Questions only</h1><p>Every item below is a <b>Practice Question</b> (platform-authored). No PYQs are claimed. Marking: MCQ 1-mark −⅓, 2-mark −⅔; MSQ/NAT no negative.</p><p><label>Subject: <select id="sub"><option value="">All</option><option value="calc">Calculus</option><option value="prog">Programming</option><option value="dbms">DBMS</option><option value="ai">AI</option><option value="ga">Aptitude</option></select></label> <input id="qq" placeholder="Search questions"></p><div id="list"></div><script src="../assets/gateda.js"></script><script>fetch("../data/practice-da.json").then(function(r){return r.json()}).then(function(d){function render(){var s=document.getElementById("sub").value,q=document.getElementById("qq").value.toLowerCase();var box=document.getElementById("list");box.innerHTML="";d.questions.filter(function(x){return(!s||x.subject===s)&&(!q||x.q.toLowerCase().indexOf(q)>=0)}).forEach(function(x){var el=document.createElement("div");el.className="q";el.innerHTML="<p><b>"+x.id+"</b> ["+x.type.toUpperCase()+", "+x.marks+" mark] — "+x.q+"</p>";if(x.o){x.o.forEach(function(o,i){var b=document.createElement("button");b.textContent=o;b.onclick=function(){var ok=(x.type==="mcq")?(i===x.a):false;GateDA.logAttempt({qid:x.id,correct:ok,subject:x.subject});alert(ok?"Correct. "+x.s:"Not quite. "+x.s)};el.appendChild(b)})}else{var inp=document.createElement("input");inp.placeholder="Numeric answer";var b=document.createElement("button");b.textContent="Check";b.onclick=function(){var v=parseFloat(inp.value);var ok=v>=x.a[0]&&v<=x.a[1];GateDA.logAttempt({qid:x.id,correct:ok,subject:x.subject});alert((ok?"Correct. ":"Answer in ["+x.a+"] ")+x.s)};el.appendChild(inp);el.appendChild(b)}var p=document.createElement("p");p.style.fontSize="12px";p.textContent="Provenance: Practice Question (platform-authored v1). Topic: "+x.topic;el.appendChild(p);box.appendChild(el)})}document.getElementById("sub").value=(new URLSearchParams(location.search).get("subject")||"");document.getElementById("sub").onchange=render;document.getElementById("qq").oninput=render;render()})</script></body></html>
