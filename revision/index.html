<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision Center — GATE DA</title><meta name="description" content="Flashcards, wrong-answer notebook, bookmarks, revision queue from your real data."><link rel="canonical" href="https://hellogaurav.me/revision"><link rel="stylesheet" href="../assets/seo.css"><style>body{font-family:Georgia,serif;max-width:860px;margin:0 auto;padding:24px 18px 60px;background:#0a0a0a;color:#f5f3ee}h1,h2{font-family:Arial,sans-serif}a{color:#e2601f}.card{border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0;background:#111}</style></head><body><nav><a href="../index.html">Home</a><a href="../dashboard">Dashboard</a><a href="../gate-ml-practice.html?m=cards">ML flashcards</a></nav><h1>Revision center</h1><div class="card"><h2>Wrong answers</h2><p id="wrong">—</p></div><div class="card"><h2>Bookmarked topics</h2><p id="bm">—</p></div><div class="card"><h2>Formulas (validated)</h2><p>Bayes: P(A|B)=P(B|A)P(A)/P(B) · Bias-variance: Err=bias²+var+noise · Taylor: f(a)+f'(a)(x−a)+… · Dijkstra O((V+E)logV) · 3NF: no transitive deps. Each links to its lesson in <a href="../syllabus">Syllabus</a>.</p></div><script src="../assets/gateda.js"></script><script>GateDALoad().then(function(d){var w=GateDA.attempts().filter(function(a){return!a.correct});document.getElementById("wrong").textContent=w.length?w.map(function(x){return x.qid}).join(", "):"No wrong answers logged yet.";var b=[];d.subjects.forEach(function(s){s.topics.forEach(function(t){if(GateDA.topicState(t.id).bookmarked)b.push(t.id)})});document.getElementById("bm").textContent=b.length?b.join(", "):"No bookmarks yet — star topics in Syllabus."})</script></body></html>
