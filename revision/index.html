<!DOCTYPE html><html lang="en" data-root="../"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision Center — GATE DA</title><meta name="description" content="Flashcards, wrong-answer notebook, bookmarks, revision queue from your real data."><link rel="canonical" href="https://hellogaurav.me/revision"><link rel="stylesheet" href="../assets/seo.css"><link rel="stylesheet" href="../assets/app.css"><style>body{margin:0}.card{border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0;background:#111}</style></head><body><main class="app-main" id="main"><div class="shell"><h1>Revision center</h1><div class="card"><h2>Wrong answers</h2><p id="wrong">—</p></div><div class="card"><h2>Bookmarked topics</h2><p id="bm">—</p></div><div class="card"><h2>Formulas (validated)</h2><p>Bayes: P(A|B)=P(B|A)P(A)/P(B) · Bias-variance: Err=bias²+var+noise · Taylor: f(a)+f'(a)(x−a)+… · Dijkstra O((V+E)logV) · 3NF: no transitive deps. Each links to its lesson in <a href="../syllabus">Syllabus</a>.</p></div><script src="../assets/gateda.js"></script><script>GateDALoad().then(function(d){var w=GateDA.attempts().filter(function(a){return!a.correct});document.getElementById("wrong").textContent=w.length?w.map(function(x){return x.qid}).join(", "):"No wrong answers logged yet.";var b=[];d.subjects.forEach(function(s){s.topics.forEach(function(t){if(GateDA.topicState(t.id).bookmarked)b.push(t.id)})});document.getElementById("bm").textContent=b.length?b.join(", "):"No bookmarks yet — star topics in Syllabus."})</script><script src="../assets/app-shell.js" defer></script>
</div></main></body></html>
