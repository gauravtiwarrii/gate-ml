<!DOCTYPE html><html lang="en" data-root="../"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Study Planner — GATE DA 2027</title><meta name="description" content="Target year, daily minutes, priorities; generates weekly plan from official syllabus + your progress."><link rel="canonical" href="https://www.hellogaurav.me/planner"><link rel="stylesheet" href="../assets/seo.css"><link rel="stylesheet" href="../assets/app.css"><style>body{margin:0}</style></head><body><main class="app-main" id="main"><div class="shell"><h1>Study planner</h1><p><label>Target year <select id="yr"><option>2027</option><option>2028</option></select></label> <label>Min/day <input id="mins" type="number" value="90" style="width:80px"></label> <button id="gen">Generate week</button></p><ol id="plan"></ol><script src="../assets/gateda.js"></script><script>document.getElementById("gen").onclick=function(){GateDALoad().then(function(d){var mins=parseInt(document.getElementById("mins").value||"90",10);GateDA.savePlan({targetYear:document.getElementById("yr").value,minPerDay:mins});var todo=[];d.subjects.forEach(function(s){s.topics.forEach(function(t){var st=GateDA.topicState(t.id);if(st.status!=="mastered")todo.push({s:s.title,t:t,pri:st.status==="revision-needed"?0:(st.lastStudied?2:1)})})});todo.sort(function(a,b){return a.pri-b.pri});var per=Math.max(1,Math.round(mins/45));var ol=document.getElementById("plan");ol.innerHTML="";todo.slice(0,7*per).forEach(function(x,i){var li=document.createElement("li");li.textContent="Day "+(Math.floor(i/per)+1)+": "+x.s+" — "+x.t.official.slice(0,80);ol.appendChild(li)});GateDA.saveTasks(todo.slice(0,14))})};</script><script src="../assets/app-shell.js" defer></script>
</div></main></body></html>
