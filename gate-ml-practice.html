/* ---------- Unit 8 · Model selection and tuning ---------- */
{id:106,t:"tune",type:"mcq",d:1,m:1,
 q:"Which of the following is a <b>hyperparameter</b> rather than a parameter?",
 o:["The weights of a linear regression","The split thresholds inside a fitted decision tree","The number of neighbours k in k-NN","The centroid positions found by k-Means"],a:2,
 s:"Parameters are learned <i>by</i> the fitting procedure; hyperparameters are set <i>before</i> it starts and control how it runs. Weights, thresholds and centroids all come out of training. k is chosen by you, usually by cross-validation."},

{id:107,t:"tune",type:"mcq",d:2,m:2,
 q:"Compared with grid search, <b>random search</b> over hyperparameters:",
 o:["Always finds a better configuration","Explores more distinct values of the hyperparameters that actually matter, for the same budget","Requires no validation set","Can only tune one hyperparameter at a time"],a:1,
 s:"A grid of 5 &times; 5 tries only 5 distinct values of each hyperparameter across 25 fits. Twenty-five random draws try 25 distinct values of each. Since usually only one or two hyperparameters matter much, the random scheme covers the important axis far more finely for the same cost &mdash; the Bergstra&ndash;Bengio result."},

{id:108,t:"tune",type:"nat",d:2,m:2,
 q:"A grid search tries 3 values of C and 4 values of &gamma;, evaluated by 5-fold cross-validation. How many <b>model fits</b> does the search perform?",a:[60,60],
 s:"Combinations = 3 &times; 4 = 12. Each is scored with 5 folds, so 12 &times; 5 = <b>60</b> fits.<br>Add a final refit on the whole training set and scikit-learn's <code>GridSearchCV</code> with <code>refit=True</code> performs 61. This multiplication is why grid search gets expensive so quickly."},

{id:109,t:"tune",type:"msq",d:2,m:2,
 q:"Which of these are <b>hyperparameters</b>? Select all that apply.",
 o:["The learning rate of gradient descent","The maximum depth of a decision tree","The regularisation strength &lambda;","The fitted coefficient on a feature"],a:[0,1,2],
 s:"A, B and C are all dials you set before training that shape the search. D is an output of training. A useful test: if changing it requires refitting the model, and the fitting procedure would never change it on its own, it is a hyperparameter."},

{id:110,t:"tune",type:"mcq",d:2,m:2,
 q:"A learning curve shows training and validation error both plateauing at a high value, with almost no gap between them. This indicates:",
 o:["High variance &mdash; collect more data","High bias &mdash; the model is too simple","Data leakage","A learning rate that is too high"],a:1,
 s:"No gap means the model is not memorising, and a high plateau means it is not fitting either &mdash; classic underfitting. More data will not help, because the curves have already flattened. Increase capacity, add features or interactions, or weaken the regularisation. A large gap would be the opposite diagnosis."},

{id:111,t:"tune",type:"nat",d:3,m:2,
 q:"<b>Nested</b> cross-validation uses 5 outer folds and 4 inner folds, with a hyperparameter grid of 6 combinations. How many model fits happen in the <b>inner</b> loops in total?",a:[120,120],
 s:"Each outer fold runs its own inner search: 4 folds &times; 6 combinations = 24 fits.<br>Across 5 outer folds: 5 &times; 24 = <b>120</b>.<br>Plus 5 refits and 5 outer evaluations. Nested CV is expensive, but it is the only honest way to report performance when hyperparameters were tuned &mdash; a single CV score is optimistic because the same data chose the settings."},

{id:112,t:"tune",type:"mcq",d:2,m:2,
 q:"<b>Early stopping</b> halts training when:",
 o:["The training loss stops decreasing","The validation loss stops improving and begins to rise","A fixed number of epochs has passed","The learning rate reaches zero"],a:1,
 s:"Training loss almost always keeps falling &mdash; that is the model memorising. The validation curve is the one that turns around, and that turning point marks where generalisation starts degrading. In practice you set a patience of several epochs and restore the weights from the best epoch, not the last."},

{id:113,t:"tune",type:"mcq",d:3,m:2,
 q:"<b>Bayesian optimisation</b> beats random search on expensive tuning problems because it:",
 o:["Tries every combination systematically","Builds a probabilistic model of the score surface and picks the next point that best trades off exploration against exploitation","Needs no validation data","Runs all evaluations in parallel"],a:1,
 s:"Each evaluation is used to update a surrogate &mdash; typically a Gaussian process or a tree-based estimator &mdash; over the hyperparameter space. An acquisition function then picks the next point to try, balancing regions that look promising against regions still unexplored. When a single fit takes hours, that sample-efficiency is worth a great deal. The catch is that it is inherently sequential."},

{id:114,t:"tune",type:"msq",d:2,m:2,
 q:"Which observations suggest <b>high variance</b> rather than high bias? Select all that apply.",
 o:["Training error is very low but validation error is much higher","Both errors are high and close together","Validation error falls steadily as more training data is added","The model's predictions change a lot when it is refitted on a different random subsample"],a:[0,2,3],
 s:"B is the signature of high bias. The other three are all variance symptoms: a large train&ndash;validation gap, a validation curve that is still improving with more data, and instability across resamples. That last one is the literal definition &mdash; variance is how much the fitted model moves when the training sample changes."},

{id:115,t:"tune",type:"nat",d:2,m:1,
 q:"A search tries learning rates 0.001, 0.01, 0.1 and momentum values 0.9, 0.95, scored with 5-fold cross-validation. How many model fits are performed?",a:[30,30],
 s:"3 learning rates &times; 2 momentum values = 6 combinations, each with 5 folds: 6 &times; 5 = <b>30</b> fits. Learning rates are searched on a logarithmic scale because what matters is the order of magnitude, not the linear spacing."},

{id:116,t:"tune",type:"mcq",d:3,m:2,
 q:"After cross-validation has identified the best hyperparameters, why is the model usually <b>refitted on the entire training set</b>?",
 o:["To make the cross-validation score valid","Because each CV model saw only a fraction of the data, and more data generally gives a better final model","To reduce the number of hyperparameters","Because the CV models are discarded automatically"],a:1,
 s:"With 5 folds each candidate model trained on only 80% of the data. Once the settings are chosen, nothing stops you from using all 100% for the model you actually ship. The CV score is kept as the performance <i>estimate</i>; the refitted model is the artefact you deploy."},

{id:117,t:"tune",type:"msq",d:3,m:2,
 q:"Which techniques reduce overfitting in a neural network? Select all that apply.",
 o:["Dropout","Weight decay (L2 penalty)","Data augmentation","Increasing the number of hidden units"],a:[0,1,2],
 s:"Dropout prevents co-adaptation, weight decay keeps the weights small and the function smooth, and augmentation manufactures new plausible training examples so the model cannot memorise. Adding hidden units raises capacity, which pushes in the opposite direction &mdash; though with heavy regularisation a wider network can still generalise well."},

{id:118,t:"tune",type:"mcq",d:2,m:2,
 q:"After trying 500 hyperparameter configurations and reporting the best validation score, that score is likely to be:",
 o:["An unbiased estimate of test performance","Optimistic, because the validation set has effectively been fitted by the selection process","Pessimistic","Exactly equal to the training score"],a:1,
 s:"Pick the maximum of 500 noisy estimates and you have partly selected for lucky noise, not just genuine quality. The validation set has been used 500 times and is no longer clean. This is why a truly untouched test set &mdash; or nested cross-validation &mdash; is needed for the number you report."},

{id:119,t:"tune",type:"nat",d:3,m:2,
 q:"For a given model, bias<sup>2</sup> = 0.09, variance = 0.16 and irreducible noise = 0.05. What is the expected <b>total test error</b>? Give two decimal places.",a:[0.29,0.31],
 s:"Expected error = bias<sup>2</sup> + variance + noise = 0.09 + 0.16 + 0.05 = <b>0.30</b>.<br>Variance is the largest contributor here, so the productive move is regularisation, more data or bagging &mdash; not a richer model, which would trade away the smaller bias term and inflate the larger variance one."},

{id:120,t:"tune",type:"mcq",d:2,m:1,
 q:"Increasing k in k-fold cross-validation from 5 to 20:",
 o:["Reduces computation","Gives each model more training data but costs roughly four times as much compute","Removes the need for a test set","Always lowers the estimated error"],a:1,
 s:"With k = 20 each model trains on 95% of the data rather than 80%, so the estimate is less pessimistically biased &mdash; but you fit twenty models instead of five. Leave-one-out is the extreme: nearly unbiased, expensive, and often high-variance because the n models are almost identical to one another."},

/* ---------- Unit 9 · Applied machine learning ---------- */
{id:121,t:"app",type:"mcq",d:1,m:1,
 q:"The main limitation of a <b>bag-of-words</b> representation is that it:",
 o:["Cannot handle long documents","Discards word order, so 'dog bites man' and 'man bites dog' are identical","Requires labelled data","Only works for English"],a:1,
 s:"A bag of words records how often each term appears and nothing else. Meaning that depends on arrangement is lost. Character or word n-grams recover a little local order, and sequence models &mdash; RNNs, Transformers &mdash; keep it properly."},

{id:122,t:"app",type:"nat",d:2,m:2,
 q:"A term appears in 10 out of 1000 documents. Using IDF = log<sub>10</sub>(N / df), what is its inverse document frequency?",a:[1.99,2.01],
 s:"IDF = log<sub>10</sub>(1000 / 10) = log<sub>10</sub>(100) = <b>2</b>.<br>A term in every document would score log<sub>10</sub>(1) = 0 and contribute nothing. The rarer the term, the larger the weight &mdash; which is exactly the behaviour you want, since rare terms are the discriminating ones."},

{id:123,t:"app",type:"mcq",d:2,m:2,
 q:"TF-IDF improves on raw term counts mainly because it:",
 o:["Is faster to compute","Down-weights terms that appear in nearly every document and so carry little discriminating power","Preserves word order","Removes the need for tokenisation"],a:1,
 s:"'The' may be the most frequent word in every document, and raw counts would make it the dominant feature everywhere. Multiplying by IDF crushes such terms toward zero and lets genuinely distinctive vocabulary come through. It is a cheap, unsupervised approximation to 'how informative is this word?'."},

{id:124,t:"app",type:"msq",d:2,m:2,
 q:"Which are standard steps when preparing raw text for a classical model? Select all that apply.",
 o:["Lowercasing and tokenisation","Removing stopwords","Stemming or lemmatisation","Sorting the documents alphabetically"],a:[0,1,2],
 s:"A, B and C all shrink the vocabulary so that surface variants collapse onto one feature &mdash; 'Running', 'running' and 'runs' become one token. D changes nothing about the content. Note that stopword removal can hurt in sentiment tasks, where 'not' carries the whole meaning."},

{id:125,t:"app",type:"mcq",d:2,m:2,
 q:"Compared with one-hot vectors, learned <b>word embeddings</b>:",
 o:["Are higher-dimensional","Are dense and place semantically related words close together in the space","Require no training corpus","Are unique to each document"],a:1,
 s:"A one-hot vector is enormous, sparse, and equidistant from every other word &mdash; 'king' is exactly as far from 'queen' as from 'bicycle'. An embedding compresses to a few hundred dense dimensions where distance encodes meaning, learned from which words share contexts."},

{id:126,t:"app",type:"nat",d:2,m:1,
 q:"What is the <b>cosine similarity</b> between the vectors [1, 0] and [1, 1]? Give two decimal places.",a:[0.70,0.71],
 s:"Dot product = 1(1) + 0(1) = 1.<br>Magnitudes: |a| = 1, |b| = &radic;2 &asymp; 1.414.<br>cos&theta; = 1 / (1 &times; 1.414) = <b>0.71</b>, the cosine of 45&deg;.<br>Cosine ignores length and compares direction only, which is why it is the standard similarity for text: a long document and a short one on the same topic still match."},

{id:127,t:"app",type:"mcq",d:2,m:2,
 q:"A recommender that suggests films because <i>users similar to you</i> liked them is using:",
 o:["Content-based filtering","Collaborative filtering","Supervised regression on film metadata","Reinforcement learning"],a:1,
 s:"Collaborative filtering works purely from the interaction matrix &mdash; who rated what &mdash; and needs no knowledge of the items themselves. Content-based filtering would instead recommend films sharing genre, director or cast with ones you already liked. Production systems usually blend both."},

{id:128,t:"app",type:"mcq",d:3,m:2,
 q:"The <b>cold-start</b> problem in recommender systems refers to:",
 o:["Slow model loading at server startup","Having no interaction history for a new user or a new item, so collaborative filtering has nothing to work with","Overfitting to popular items","Numerical instability in matrix factorisation"],a:1,
 s:"With no ratings, a new user has no neighbours and a new item has no co-rating signal. Typical fixes fall back on content features, ask a few onboarding questions, or serve popularity-based recommendations until enough interactions accumulate."},

{id:129,t:"app",type:"msq",d:2,m:2,
 q:"Which are legitimate engineered features for a next-day sales forecast? Select all that apply.",
 o:["Sales on the previous day (lag-1)","A 7-day rolling mean of sales","Day of week and holiday indicator","Next week's actual sales"],a:[0,1,2],
 s:"A, B and C are all computable at prediction time from information already available. D is a future value &mdash; including it is target leakage, and the model would score beautifully in backtesting and be useless in production. The test for any time-series feature is simple: would I actually know this on the morning I make the prediction?"},

{id:130,t:"app",type:"mcq",d:2,m:2,
 q:"With only 2000 labelled images, the most effective approach is usually to:",
 o:["Train a deep CNN from random initialisation","Fine-tune a network pretrained on a large image corpus","Use logistic regression on raw pixels","Collect no more data and accept the result"],a:1,
 s:"The early layers of a pretrained network have already learned edges, textures and shapes, which transfer to almost any visual domain. Freezing most of them and retraining the final layers on 2000 images typically beats training from scratch by a wide margin, because the from-scratch model has far too many parameters for that much data."},

{id:131,t:"app",type:"nat",d:3,m:2,
 q:"A recommender predicts ratings 3, 3, 4 where the true ratings are 4, 3, 5. What is the <b>RMSE</b>? Give two decimal places.",a:[0.81,0.82],
 s:"Errors: 4 &minus; 3 = 1, 3 &minus; 3 = 0, 5 &minus; 4 = 1.<br>Squared: 1, 0, 1 &rarr; sum = 2.<br>MSE = 2/3 = 0.6667, RMSE = &radic;0.6667 = <b>0.82</b>.<br>RMSE is reported rather than MSE because it is back in the original units &mdash; here, rating stars."},

{id:132,t:"app",type:"mcq",d:2,m:2,
 q:"Which augmentation would be <b>inappropriate</b> for a handwritten-digit classifier?",
 o:["Small rotations of a few degrees","Slight translations","Vertical flipping","Mild elastic distortion"],a:2,
 s:"Augmentation must preserve the label. Flipping a 6 vertically does not produce a valid 6 &mdash; it produces something closer to a 9, or nothing legible at all. Small rotations, shifts and distortions all leave the digit recognisably itself. Horizontal flips are fine for natural photographs of cats, and wrong for text."},

{id:133,t:"app",type:"msq",d:3,m:2,
 q:"A categorical feature has 50,000 distinct values (say, product IDs). Which are sensible approaches? Select all that apply.",
 o:["Group rare categories into a single 'other' bucket","Target encoding with smoothing, fitted inside the cross-validation folds","A learned embedding layer","Plain one-hot encoding into 50,000 columns"],a:[0,1,2],
 s:"D produces an unusably wide, sparse matrix in which most columns fire a handful of times. Bucketing rare levels, smoothed target encoding (computed inside each fold, or it leaks), and learned embeddings are the three standard answers. Gradient-boosting libraries such as CatBoost and LightGBM handle high-cardinality columns natively."},

{id:134,t:"app",type:"mcq",d:2,m:1,
 q:"A time series is <b>stationary</b> when:",
 o:["Its values never change","Its statistical properties such as mean and variance do not change over time","It has no seasonality by construction","It is measured at regular intervals"],a:1,
 s:"Classical models such as ARIMA assume stationarity because they estimate a fixed relationship between a point and its recent past. A trending or seasonal series breaks that, so it is differenced or seasonally adjusted first &mdash; the 'I' in ARIMA is exactly this differencing step."},

{id:135,t:"app",type:"mcq",d:3,m:2,
 q:"Adding <b>bigrams</b> to a bag-of-words model helps mainly because:",
 o:["It reduces the size of the vocabulary","It captures short local phrases such as 'not good', whose meaning is lost when the words are counted separately","It removes the need for TF-IDF","It makes the model linear"],a:1,
 s:"Unigrams see 'not' and 'good' independently, and 'good' pulls the prediction positive. The bigram 'not good' is a single feature carrying the correct sentiment. The cost is a much larger vocabulary and sparser counts, so bigrams are usually kept only above a minimum document frequency."},

/* ---------- Unit 10 · Deployment, MLOps and responsible AI ---------- */
{id:136,t:"dep",type:"mcq",d:1,m:1,
 q:"A deployed model's accuracy decays steadily over six months although the code has not changed. The most likely cause is:",
 o:["The model file has become corrupted","Drift &mdash; the live data distribution has moved away from the training distribution","The server is too slow","The test set was too small"],a:1,
 s:"Models are snapshots of a world that keeps moving: prices change, fraud tactics evolve, user behaviour shifts. Nothing about the model degrades, but its assumptions age. The remedy is monitoring for drift and retraining on a schedule or on a trigger."},

{id:137,t:"dep",type:"mcq",d:2,m:2,
 q:"The difference between <b>data drift</b> and <b>concept drift</b> is:",
 o:["Data drift is the input distribution P(x) changing; concept drift is the relationship P(y | x) changing","They are the same thing","Data drift affects only categorical features","Concept drift happens only during training"],a:0,
 s:"If your customers get younger, the inputs have shifted but the rule 'younger customers churn more' may still hold &mdash; data drift. If a competitor launches and the very meaning of a churn signal changes, the mapping itself has changed &mdash; concept drift, which is harder to spot because you cannot detect it from inputs alone. It needs labels."},

{id:138,t:"dep",type:"msq",d:2,m:2,
 q:"What should be monitored for a model running in production? Select all that apply.",
 o:["Input feature distributions compared with training","Prediction distribution over time","Latency and error rates of the serving endpoint","Accuracy on the original training set"],a:[0,1,2],
 s:"A, B and C can all be computed live, without waiting for ground truth. D is static &mdash; the training score cannot change and tells you nothing about today. Once labels eventually arrive, live accuracy should of course be tracked too, but the leading indicators are the distributional ones."},

{id:139,t:"dep",type:"mcq",d:2,m:2,
 q:"<b>Batch</b> inference is preferable to real-time serving when:",
 o:["Predictions are needed within milliseconds of a user action","Predictions for a known set of entities can be computed on a schedule and looked up later","The model is very small","The features change every second"],a:1,
 s:"Nightly churn scores for every customer is the archetype: compute them all at once, write them to a table, and the application just reads a row. It is cheaper and far simpler operationally. Real-time serving is only necessary when the input is not known in advance &mdash; a fraud check on a transaction happening right now."},

{id:140,t:"dep",type:"nat",d:2,m:2,
 q:"A model takes 20 milliseconds per prediction and a worker handles requests one at a time. How many requests per second can a single worker serve?",a:[50,50],
 s:"1000 ms / 20 ms = <b>50</b> requests per second per worker.<br>Meeting 500 requests per second therefore needs at least 10 workers, before any headroom for traffic spikes. This back-of-envelope calculation is what turns a latency figure into a capacity plan."},

{id:141,t:"dep",type:"mcq",d:2,m:2,
 q:"In a <b>shadow deployment</b>, the new model:",
 o:["Replaces the old model immediately for all users","Receives live traffic and its predictions are logged and compared, but they are not shown to users","Runs only on historical data","Is served to a random 50% of users"],a:1,
 s:"Shadow mode answers 'how would this behave on real traffic?' at zero user risk, and catches the problems offline evaluation misses &mdash; feature pipeline mismatches, latency spikes, unexpected input values. D describes an A/B test, which does expose users and comes later."},

{id:142,t:"dep",type:"msq",d:3,m:2,
 q:"What is needed to make a training run <b>reproducible</b>? Select all that apply.",
 o:["A versioned snapshot of the training data","Pinned library versions and a recorded environment","Fixed random seeds","A faster GPU"],a:[0,1,2],
 s:"Data, code, environment and seed are the four things that together determine the output. Miss any one and the run cannot be recreated six months later when someone asks why the model behaves as it does. Hardware affects speed, not the result &mdash; though note that some GPU operations are non-deterministic unless explicitly configured otherwise."},

{id:143,t:"dep",type:"mcq",d:3,m:2,
 q:"<b>Training&ndash;serving skew</b> occurs when:",
 o:["The training set is imbalanced","Features are computed differently in the training pipeline and the serving pipeline, so the model sees inputs it was never trained on","The model is too large to serve","Training takes longer than inference"],a:1,
 s:"A classic instance: training computes a 30-day average from a warehouse table, while the production service computes it from a slightly different window in a different language. The model is fine; the inputs no longer mean the same thing. A shared feature store, or reusing exactly the same transformation code in both paths, is the structural fix."},

{id:144,t:"dep",type:"mcq",d:2,m:2,
 q:"A hiring model selects 30% of male and 15% of female applicants. Which fairness criterion does this most directly violate?",
 o:["Demographic parity","Equalised odds","Calibration","Individual fairness"],a:0,
 s:"Demographic parity asks that the selection rate be equal across groups, and 30% against 15% plainly is not. Equalised odds is a different requirement &mdash; equal true-positive and false-positive rates &mdash; and it can hold even when selection rates differ, if the underlying qualification rates differ. These criteria are provably impossible to satisfy all at once, so which one applies is a decision about values, not mathematics."},

{id:145,t:"dep",type:"msq",d:2,m:2,
 q:"Which are genuine sources of bias in a machine learning system? Select all that apply.",
 o:["Historical bias already present in the labels","Under-representation of a group in the training sample","A proxy feature such as postcode standing in for a protected attribute","Using cross-validation instead of a single holdout"],a:[0,1,2],
 s:"Bias enters through the data and through the framing, not through the validation scheme. Labels recording past human decisions carry those decisions forward; a group with few samples gets a worse fit; and dropping a protected attribute achieves nothing if a correlated proxy remains in the feature set."},

{id:146,t:"dep",type:"mcq",d:2,m:1,
 q:"<b>SHAP</b> values are used to:",
 o:["Speed up inference","Attribute a single prediction to the contributions of individual features","Compress the model","Detect data drift"],a:1,
 s:"SHAP borrows the Shapley value from cooperative game theory and splits a prediction's departure from the baseline among the features, with the attractive property that the contributions sum exactly to that gap. It gives a local explanation &mdash; why <i>this</i> loan was declined &mdash; which is often what a regulator or a customer is actually asking for."},

{id:147,t:"dep",type:"nat",d:3,m:2,
 q:"Group A has a selection rate of 0.30 and group B a selection rate of 0.15. What is the <b>disparate impact ratio</b> (unprivileged over privileged)? Give two decimal places.",a:[0.49,0.51],
 s:"Ratio = 0.15 / 0.30 = <b>0.50</b>.<br>Under the widely used four-fifths rule, a ratio below 0.80 is treated as evidence of adverse impact, so 0.50 would fail it decisively. Treat the threshold as a screening signal that prompts investigation, not as a legal verdict on its own."},

{id:148,t:"dep",type:"mcq",d:2,m:2,
 q:"An online <b>A/B test</b> is run after offline evaluation because:",
 o:["Offline metrics are always wrong","Offline gains do not always translate into the business outcome that matters, and only live traffic can measure that","It is cheaper than offline evaluation","It removes the need for a test set"],a:1,
 s:"A recommender may improve offline ranking accuracy while reducing actual clicks, because the offline data was itself collected under the old policy. Only a randomised live experiment measures the effect on the metric the business cares about, with real users reacting to real changes."},

{id:149,t:"dep",type:"mcq",d:3,m:2,
 q:"Shipping a model as a bare pickle file, with no environment specification, is fragile because:",
 o:["Pickle files are always large","Unpickling depends on the exact library versions and class definitions present at load time, so a version bump can break or silently alter the model","Pickle cannot store numeric arrays","It makes inference slower"],a:1,
 s:"A pickle stores references to classes, not their code. Load it under a different scikit-learn version and it may raise an error &mdash; or worse, load successfully with changed internal behaviour. Pin the versions, containerise the runtime, or export to a stable format such as ONNX or PMML."},

{id:150,t:"dep",type:"msq",d:2,m:2,
 q:"Which practices belong to responsible deployment of an ML system? Select all that apply.",
 o:["Documenting the intended use and known limitations of the model","Evaluating performance separately for each affected subgroup","Providing a route for people to contest an automated decision","Keeping the training data secret so the model cannot be copied"],a:[0,1,2],
 s:"A, B and C map onto model cards, disaggregated evaluation and meaningful human review &mdash; the practical core of responsible AI. D is a commercial consideration, not an ethical safeguard; secrecy about training data usually works against accountability rather than for it."},

/*--QEND--*/
];

/* Flashcards: f = front (prompt), b = back (answer), t = topic key */
const CARDS = [
/* ---------- Unit 1 · Foundations ---------- */
{t:"found",f:"Supervised vs unsupervised vs reinforcement &mdash; in one line each.",
 b:"<b>Supervised:</b> learn a mapping from inputs to known labels.<br><b>Unsupervised:</b> find structure in inputs with no labels.<br><b>Reinforcement:</b> an agent takes actions and learns from delayed reward."},
{t:"found",f:"What is <b>inductive bias</b>?",
 b:"The set of assumptions a learner uses to pick one hypothesis out of the many that fit the training data. Without it, generalising to unseen inputs is impossible. Example: k-NN assumes nearby points share a label."},
{t:"found",f:"Write the <b>bias&ndash;variance decomposition</b> of expected test error.",
 b:"E[error] = bias<sup>2</sup> + variance + irreducible noise.<br>Bias falls with a richer model, variance falls with more data or regularisation, noise never falls."},
{t:"found",f:"Overfitting vs underfitting &mdash; how do you tell them apart from the errors?",
 b:"<b>Overfitting:</b> low training error, much higher test error (big gap).<br><b>Underfitting:</b> both errors high and close together.<br>The <i>gap</i> is the diagnostic, not either number alone."},
{t:"found",f:"Why do we need a separate validation set as well as a test set?",
 b:"Any set used to make a choice stops being an unbiased estimator. Hyperparameters are chosen on validation; the test set is opened exactly once, at the end, to report."},
{t:"found",f:"<b>Curse of dimensionality</b> &mdash; state it in one sentence.",
 b:"As dimensions grow the space expands exponentially, data becomes sparse, and distances lose contrast &mdash; so distance-based methods degrade and the sample size needed for the same density explodes."},

/* ---------- Unit 2 · Preprocessing ---------- */
{t:"prep",f:"Standardisation vs min&ndash;max scaling &mdash; formula and when to use each.",
 b:"<b>Standardise:</b> z = (x &minus; &mu;)/&sigma; &rarr; mean 0, sd 1. Safe default; robust to outliers relative to min&ndash;max.<br><b>Min&ndash;max:</b> (x &minus; min)/(max &minus; min) &rarr; [0, 1]. Use when a bounded range is needed; one outlier ruins it."},
{t:"prep",f:"What is <b>data leakage</b>, in one sentence, plus the commonest example?",
 b:"Information that would not be available at prediction time creeping into training. Commonest case: fitting a scaler or imputer on the full dataset before the train/test split."},
{t:"prep",f:"Which transformers must be fitted on the training split only?",
 b:"Every one that learns a number from the data &mdash; scaler means and variances, imputer medians, encoder category lists, the PCA rotation. Wrap them in a <code>Pipeline</code> so cross-validation refits them per fold."},
{t:"prep",f:"Ordinal vs one-hot encoding &mdash; when does each apply?",
 b:"<b>Ordinal:</b> the categories have a real order (Low &lt; Medium &lt; High) worth preserving.<br><b>One-hot:</b> nominal categories with no order (city, colour), where integers would invent a false relationship."},
{t:"prep",f:"State the <b>1.5 &times; IQR</b> outlier rule.",
 b:"IQR = Q<sub>3</sub> &minus; Q<sub>1</sub>. Flag anything below Q<sub>1</sub> &minus; 1.5&nbsp;IQR or above Q<sub>3</sub> + 1.5&nbsp;IQR. Values exactly on a fence are not outliers."},
{t:"prep",f:"Three ways to handle <b>class imbalance</b>.",
 b:"Oversample the minority (SMOTE synthesises new points rather than duplicating), undersample the majority, or reweight the loss via <code>class_weight</code>. Always pair with stratified folds and a metric other than accuracy."},

/* ---------- Unit 3 · Regression ---------- */
{t:"reg",f:"Least-squares slope and intercept for simple linear regression.",
 b:"slope = S<sub>xy</sub> / S<sub>xx</sub> = &Sigma;(x&minus;x&#772;)(y&minus;y&#772;) / &Sigma;(x&minus;x&#772;)<sup>2</sup><br>intercept = y&#772; &minus; slope &times; x&#772;<br>The fitted line always passes through (x&#772;, y&#772;)."},
{t:"reg",f:"MSE, RMSE, MAE, R<sup>2</sup> &mdash; one line each.",
 b:"<b>MSE</b> = mean squared residual; punishes big misses hardest.<br><b>RMSE</b> = &radic;MSE; back in the target's units.<br><b>MAE</b> = mean absolute residual; robust to outliers.<br><b>R<sup>2</sup></b> = 1 &minus; SS<sub>res</sub>/SS<sub>tot</sub>; share of variance explained."},
{t:"reg",f:"Ridge vs Lasso &mdash; penalty and effect.",
 b:"<b>Ridge (L2):</b> &lambda;&Sigma;w<sub>j</sub><sup>2</sup>. Shrinks all coefficients smoothly, keeps everything, handles collinearity.<br><b>Lasso (L1):</b> &lambda;&Sigma;|w<sub>j</sub>|. Corner at zero drives coefficients exactly to zero &rarr; feature selection."},
{t:"reg",f:"Which way does raising &lambda; move bias and variance?",
 b:"Up-&lambda; &rarr; more constraint &rarr; <b>bias rises, variance falls</b>. &lambda; = 0 recovers ordinary least squares; &lambda; &rarr; &infin; drives every coefficient to zero."},
{t:"reg",f:"Give the gradient-descent update rule.",
 b:"w &larr; w &minus; &eta; &middot; &part;L/&part;w<br>Too large an &eta; diverges to NaN; too small crawls. Search &eta; on a log scale: 0.001, 0.01, 0.1."},
{t:"reg",f:"When does the normal equation fail, and what fixes it?",
 b:"When X<sup>T</sup>X is singular &mdash; perfectly collinear features, or d &gt; n. Ridge fixes it: (X<sup>T</sup>X + &lambda;I) is invertible for any &lambda; &gt; 0."},

/* ---------- Unit 4 · Classification ---------- */
{t:"clf",f:"Sigmoid formula, and what logistic regression's decision boundary looks like.",
 b:"&sigma;(z) = 1/(1 + e<sup>&minus;z</sup>), with z = w&middot;x + b.<br>The boundary is the set where z = 0 &mdash; a <b>hyperplane</b>, i.e. straight in the original feature space."},
{t:"clf",f:"Entropy and Gini for a node with class proportions p<sub>k</sub>.",
 b:"H = &minus;&Sigma; p<sub>k</sub> log<sub>2</sub> p<sub>k</sub> &nbsp;(max 1 bit for two balanced classes)<br>Gini = 1 &minus; &Sigma; p<sub>k</sub><sup>2</sup> &nbsp;(max 0.5 for two balanced classes)<br>Both are 0 for a pure node and almost always pick the same split."},
{t:"clf",f:"What is <i>naive</i> about Naive Bayes, and why does it still work?",
 b:"It assumes features are conditionally independent given the class. Usually false, but the classifier only has to <i>rank</i> the classes correctly &mdash; and errors in the factorisation often cancel in the ranking even when the probabilities are badly calibrated."},
{t:"clf",f:"SVM: what is a support vector, and what does C control?",
 b:"A <b>support vector</b> is a training point on or inside the margin &mdash; only these determine the boundary.<br><b>Large C:</b> heavy penalty for violations &rarr; narrow margin, risk of overfitting. <b>Small C:</b> wider, more tolerant margin."},
{t:"clf",f:"State the <b>kernel trick</b>.",
 b:"Algorithms that touch the data only through inner products can replace x<sub>i</sub>&middot;x<sub>j</sub> with K(x<sub>i</sub>, x<sub>j</sub>), computing an inner product in a much richer space without ever constructing the features there."},
{t:"clf",f:"How does k affect a k-NN classifier?",
 b:"<b>k = 1:</b> zero training error, jagged boundary, high variance.<br><b>Large k:</b> smoother boundary, higher bias; at k = n it predicts the majority class everywhere.<br>Always scale the features first, and use odd k to avoid ties."},

/* ---------- Unit 5 · Evaluation and ensembles ---------- */
{t:"evl",f:"Precision, recall, F1 &mdash; formulas and when each matters.",
 b:"<b>Precision</b> = TP/(TP+FP): of what I flagged, how much was right. Matters when false alarms are costly.<br><b>Recall</b> = TP/(TP+FN): of what existed, how much I caught. Matters when misses are costly.<br><b>F1</b> = 2PR/(P+R), the harmonic mean."},
{t:"evl",f:"Why is accuracy misleading on imbalanced data?",
 b:"With 1% positives, always predicting 'negative' scores 99% and detects nothing. Use precision, recall, F1, the PR curve, and read the confusion matrix directly."},
{t:"evl",f:"ROC AUC &mdash; what does it actually measure?",
 b:"The probability that a randomly chosen positive is scored above a randomly chosen negative. 0.5 = random, 1.0 = perfect ranking. It is threshold-free, so you must still pick an operating threshold separately."},
{t:"evl",f:"ROC curve or PR curve &mdash; which, and when?",
 b:"Use <b>PR</b> when positives are rare or the negative class is huge: ROC's false-positive rate is diluted by an enormous TN count and looks flatteringly good. Use <b>ROC</b> when classes are roughly balanced."},
{t:"evl",f:"Bagging vs boosting &mdash; the essential difference.",
 b:"<b>Bagging:</b> independent models on bootstrap samples, averaged &rarr; cuts <b>variance</b>. Parallel. Random forest.<br><b>Boosting:</b> sequential models, each fixing the last one's errors &rarr; cuts <b>bias</b>. Can overfit if run too long. AdaBoost, gradient boosting."},
{t:"evl",f:"What makes a random forest better than one deep tree?",
 b:"Bootstrap rows plus a random feature subset at each split decorrelate the trees; averaging decorrelated high-variance trees cancels their noise. Out-of-bag rows (~37% per tree) give a free validation estimate."},

/* ---------- Unit 6 · Unsupervised learning ---------- */
{t:"uns",f:"The two alternating steps of k-Means, and what it minimises.",
 b:"<b>Assign</b> each point to the nearest centroid, then <b>update</b> each centroid to the mean of its members. Repeat. It minimises the within-cluster sum of squares (inertia) and converges to a <i>local</i> optimum."},
{t:"uns",f:"How do you choose k?",
 b:"<b>Elbow:</b> plot inertia against k and take the bend &mdash; inertia alone always falls, so its minimum is useless.<br><b>Silhouette:</b> take the k with the highest mean score.<br>Plus whatever the domain actually needs."},
{t:"uns",f:"Silhouette formula and how to read it.",
 b:"s = (b &minus; a)/max(a, b), where a = mean distance within its own cluster, b = mean distance to the nearest other cluster.<br>Near +1 well placed, near 0 on a boundary, negative probably in the wrong cluster."},
{t:"uns",f:"What can DBSCAN do that k-Means cannot?",
 b:"Find arbitrarily shaped clusters, label sparse points as noise instead of forcing them in, and work without being told k. Its own cost: two hyperparameters (&epsilon;, minPts) and trouble with clusters of differing density."},
{t:"uns",f:"What is the first principal component?",
 b:"The direction of maximum variance &mdash; the top eigenvector of the covariance matrix, with its eigenvalue equal to the variance captured. Equivalently, the line minimising squared perpendicular distances."},
{t:"uns",f:"Two things to remember before running PCA.",
 b:"<b>Standardise first</b> when units differ, or the largest-scaled feature monopolises PC1. And accept that the components are dense mixtures of the originals, so they rarely have a clean interpretation."},

/* ---------- Unit 7 · Neural networks ---------- */
{t:"nn",f:"How many parameters does a dense layer have?",
 b:"(fan-in &times; fan-out) + fan-out &mdash; weights plus one bias per output unit. Example: 4 &rarr; 5 &rarr; 3 gives (20+5) + (15+3) = 43."},
{t:"nn",f:"Why is a non-linear activation essential?",
 b:"Stacked affine maps compose into a single affine map, so without a non-linearity a hundred layers has exactly the representational power of one."},
{t:"nn",f:"Sigmoid, tanh, ReLU, softmax &mdash; range and use.",
 b:"<b>Sigmoid</b> (0,1): binary output.<br><b>tanh</b> (&minus;1,1): zero-centred hidden units.<br><b>ReLU</b> [0,&infin;): default hidden activation, derivative 1 on the positive side.<br><b>Softmax</b>: multi-class output, sums to 1."},
{t:"nn",f:"Vanishing gradients &mdash; cause and three fixes.",
 b:"Backprop multiplies one derivative per layer; sigmoid's peaks at 0.25, so deep stacks shrink to nothing. Fix with <b>ReLU</b>, <b>batch normalisation</b>, and <b>residual (skip) connections</b>."},
{t:"nn",f:"Convolution output size, and a conv layer's parameter count.",
 b:"Output = (W &minus; F + 2P)/S + 1.<br>Parameters = (F &times; F &times; C<sub>in</sub> &times; C<sub>out</sub>) + C<sub>out</sub> &mdash; independent of image size, because the filter weights are shared across every position."},
{t:"nn",f:"What does dropout do, and what changes at test time?",
 b:"During training it randomly zeroes a fraction of activations so no unit can depend on a specific partner. At test time it is switched off and activations are rescaled so expectations match."},

/* ---------- Unit 8 · Model selection and tuning ---------- */
{t:"tune",f:"Parameter or hyperparameter?",
 b:"<b>Parameter:</b> learned by fitting &mdash; weights, split thresholds, centroids.<br><b>Hyperparameter:</b> set before fitting &mdash; k, max depth, &lambda;, learning rate. Changing it means refitting."},
{t:"tune",f:"How many fits does a grid search perform?",
 b:"(product of the grid sizes) &times; k folds, plus one final refit on the whole training set. A 3 &times; 4 grid with 5-fold CV is 60 fits, 61 with the refit."},
{t:"tune",f:"Why does random search often beat grid search?",
 b:"Only one or two hyperparameters usually matter. For the same budget, n random draws explore n distinct values along each axis, whereas a grid reuses the same few values over and over."},
{t:"tune",f:"Reading a learning curve.",
 b:"<b>Both high, flat, no gap</b> &rarr; high bias: add capacity or features; more data will not help.<br><b>Large gap, validation still falling</b> &rarr; high variance: more data, regularisation, or simplify."},
{t:"tune",f:"Why nested cross-validation?",
 b:"Tuning on a validation split makes that split's score optimistic &mdash; it was used to choose. An inner loop tunes, an outer loop estimates, so the reported figure is honest. Cost: outer &times; inner &times; grid fits."},
{t:"tune",f:"What does early stopping monitor, and why not the training loss?",
 b:"The <b>validation</b> loss &mdash; it turns upward when generalisation starts degrading. Training loss almost always keeps falling, because that is the model memorising. Use patience, and restore the best epoch's weights."},

/* ---------- Unit 9 · Applied ML ---------- */
{t:"app",f:"TF-IDF &mdash; formula and purpose.",
 b:"TF-IDF = tf(t, d) &times; log(N / df(t)). It rewards terms frequent in this document but rare across the corpus, so ubiquitous words like 'the' collapse toward zero weight."},
{t:"app",f:"Cosine similarity &mdash; formula and why it suits text.",
 b:"cos&theta; = (a&middot;b)/(|a||b|). It compares direction and ignores magnitude, so a long document and a short one on the same topic still score as similar."},
{t:"app",f:"Collaborative vs content-based filtering.",
 b:"<b>Collaborative:</b> uses the interaction matrix &mdash; people like you liked this. Needs no item features, but suffers cold start.<br><b>Content-based:</b> uses item attributes &mdash; similar to what you already liked. Handles new items."},
{t:"app",f:"Which features are safe in a time-series model?",
 b:"Anything computable at prediction time: lags, rolling statistics, calendar and holiday flags. <b>Never</b> a future value &mdash; that is target leakage, and it backtests beautifully while being useless in production."},
{t:"app",f:"When should you reach for transfer learning?",
 b:"Small labelled dataset, large pretrained model available in the same modality. Freeze the early layers (generic edges and textures), retrain the head. Almost always beats training from scratch on a few thousand images."},
{t:"app",f:"Handling a categorical feature with tens of thousands of levels.",
 b:"Bucket rare levels into 'other', use smoothed target encoding fitted <i>inside</i> each CV fold, or learn an embedding. Plain one-hot would produce an unusable sparse matrix."},

/* ---------- Unit 10 · Deployment and responsible AI ---------- */
{t:"dep",f:"Data drift vs concept drift.",
 b:"<b>Data drift:</b> P(x) moves &mdash; detectable from inputs alone.<br><b>Concept drift:</b> P(y|x) moves &mdash; the rule itself changed, so it needs labels to detect. Harder and more dangerous."},
{t:"dep",f:"What do you monitor on a live model?",
 b:"Input feature distributions against the training reference, the prediction distribution over time, latency and error rates, and &mdash; once labels arrive &mdash; live accuracy. The training score is static and tells you nothing."},
{t:"dep",f:"What is training&ndash;serving skew?",
 b:"The same feature computed differently in the training pipeline and the serving pipeline. The model is fine; the inputs no longer mean the same thing. Fix by sharing the transformation code or using a feature store."},
{t:"dep",f:"Shadow deployment vs canary vs A/B test.",
 b:"<b>Shadow:</b> new model sees live traffic, output logged, never shown &mdash; zero user risk.<br><b>Canary:</b> served to a small slice, watched, then rolled out.<br><b>A/B:</b> randomised split to measure the business metric."},
{t:"dep",f:"Four ingredients of a reproducible training run.",
 b:"Versioned <b>data</b>, versioned <b>code</b>, a pinned <b>environment</b>, and a fixed <b>random seed</b>. Miss any one and the run cannot be recreated when someone asks why the model behaves as it does."},
{t:"dep",f:"Demographic parity vs equalised odds.",
 b:"<b>Demographic parity:</b> equal selection rate across groups.<br><b>Equalised odds:</b> equal true-positive and false-positive rates across groups.<br>They generally cannot both hold. Choosing between them is a values decision, not a mathematical one."},

/*--CEND--*/
];
</script>

  { k:"home",     n:"Home" },
  { k:"practice", n:"Practice" },
  { k:"mock",     n:"Mock test" },
  { k:"review",   n:"Review" },
  { k:"cards",    n:"Flashcards" }
];

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); }
function byId(id) { return document.getElementById(id); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtTime(s) {
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h > 0 ? h + ":" + pad(m) + ":" + pad(x) : pad(m) + ":" + pad(x);
}
function letter(i) { return "ABCDEFGH"[i]; }

/* ============================================================
   Answer checking and GATE marking
   ============================================================ */
function answered(a) {
  if (a == null) return false;
  if (Array.isArray(a)) return a.length > 0;
  return String(a).trim() !== "";
}
function isCorrect(q, a) {
  if (!answered(a)) return false;
  if (q.type === "mcq") return a === q.a;
  if (q.type === "msq") {
    if (!Array.isArray(a)) return false;
    return a.slice().sort().join(",") === q.a.slice().sort().join(",");
  }
  var v = parseFloat(a);
  return !isNaN(v) && v >= q.a[0] - 1e-9 && v <= q.a[1] + 1e-9;
}
/* MCQ carries negative marking (1/3 of the question's marks).
   MSQ and NAT do not, which matches the real paper. */
function marksFor(q, a) {
  if (!answered(a)) return 0;
  if (isCorrect(q, a)) return q.m;
  return q.type === "mcq" ? -(q.m / 3) : 0;
}
function answerText(q) {
  if (q.type === "mcq") return "Option " + letter(q.a);
  if (q.type === "msq") return q.a.map(function (i) { return "Option " + letter(i); }).join(", ");
  return q.a[0] === q.a[1] ? String(q.a[0]) : q.a[0] + " to " + q.a[1];
}

function record(q, a) {
  P.att[q.id] = (P.att[q.id] || 0) + 1;
  P.res[q.id] = isCorrect(q, a) ? 1 : 0;
  save();
}

/* ============================================================
   Shared question renderer
   opts.instant  reveal the solution as soon as an answer is given
   opts.locked   read-only, always show the solution
   ============================================================ */
function questionHTML(q, n, total, a, opts) {
  var reveal = opts.locked || (opts.instant && S.shown[q.id]);
  var label = n === "" ? "Warm-up" : "Q" + n + (total ? '<span class="faint" style="font-weight:400"> / ' + total + '</span>' : '');
  var h = '<div class="qmeta">' +
    '<span class="qno">' + label + '</span>' +
    '<span class="tag t-' + q.type + '">' + q.type.toUpperCase() + '</span>' +
    '<span class="tag">' + q.m + ' mark' + (q.m > 1 ? 's' : '') + '</span>' +
    '<span class="tag' + (q.d === 3 ? ' d-hard' : '') + '">' + DIFF[q.d] + '</span>' +
    '<span class="tag">' + esc(TOPICS[q.t].n) + '</span>' +
    '<span class="spacer"></span>' +
    '<button class="btn sm bm" id="bmBtn" aria-pressed="' + (P.bm[q.id] ? "true" : "false") + '">' +
      (P.bm[q.id] ? "Bookmarked" : "Bookmark") + '</button>' +
    '</div>';

  h += '<div class="qstem">' + q.q + '</div>';

  if (q.type === "nat") {
    var cls = "";
    if (reveal) cls = isCorrect(q, a) ? " right" : (answered(a) ? " wrong" : "");
    h += '<div class="natwrap">' +
      '<input id="natIn" type="text" inputmode="decimal" autocomplete="off" placeholder="Your answer" ' +
      'value="' + (a == null ? "" : esc(a)) + '"' + (opts.locked ? " disabled" : "") + ' class="' + cls.trim() + '">' +
      '<span class="faint">Numerical answer — no negative marking</span></div>';
  } else {
    h += '<div class="opts">';
    for (var i = 0; i < q.o.length; i++) {
      var sel = q.type === "msq" ? (Array.isArray(a) && a.indexOf(i) > -1) : a === i;
      var c = "opt";
      if (reveal) {
        var correct = q.type === "msq" ? q.a.indexOf(i) > -1 : q.a === i;
        if (correct && sel) c += " right";
        else if (correct) c += " missed";
        else if (sel) c += " wrong";
      } else if (sel) c += " sel";
      h += '<button class="' + c + '" data-opt="' + i + '"' + (reveal || opts.locked ? " disabled" : "") + '>' +
        '<span class="olet">' + letter(i) + '</span><span>' + q.o[i] + '</span></button>';
    }
    h += '</div>';
    if (q.type === "msq") h += '<p class="faint" style="font-size:13px;margin-top:-8px">Select every option that applies. No negative marking.</p>';
  }
  return h;
}

function solutionHTML(q, a) {
  var v, cls, txt;
  if (!answered(a)) { cls = "skip"; txt = "Not answered"; }
  else if (isCorrect(q, a)) { cls = "ok"; txt = "Correct"; }
  else { cls = "no"; txt = "Incorrect"; }
  v = '<div class="verdict ' + cls + '">' + txt +
      '<span class="spacer"></span><span style="font-weight:500">Answer: ' + esc(answerText(q)) + '</span></div>';
  return v + '<div class="sol"><h3>Why</h3><div class="body">' + q.s + '</div></div>';
}

/* ============================================================
   Router
   ============================================================ */
function renderModes() {
  modesEl.innerHTML = MODES.map(function (m) {
    return '<button data-mode="' + m.k + '" aria-current="' + (S.mode === m.k ? "true" : "false") + '">' + m.n + '</button>';
  }).join("");
}
modesEl.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-mode]");
  if (!b) return;
  if (S.mock && !S.mock.submitted && b.dataset.mode !== "mock") {
    if (!confirm("Leaving now abandons the test in progress. Continue?")) return;
    endMock();
  }
  go(b.dataset.mode);
});

function go(mode) {
  S.mode = mode;
  if (mode !== "mock") { clock.hidden = true; stopTimer(); }
  renderModes();
  window.scrollTo(0, 0);
  ({ home:viewHome, practice:viewPractice, mock:viewMock, review:viewReview, cards:viewCards })[mode]();
}

/* ============================================================
   Home
   ============================================================ */
var warmup = null;
function viewHome() {
  var ids = Object.keys(P.res), att = ids.length;
  var right = ids.filter(function (k) { return P.res[k] === 1; }).length;
  var wrong = att - right;
  var acc = att ? Math.round(right / att * 100) : 0;
  var bm = Object.keys(P.bm).filter(function (k) { return P.bm[k]; }).length;

  if (!warmup) {
    var pool = QUESTIONS.filter(function (q) { return q.d === 1 && !P.res[q.id]; });
    if (!pool.length) pool = QUESTIONS;
    warmup = pool[Math.floor(Math.random() * pool.length)];
  }

  var last = P.mocks.length ? P.mocks[P.mocks.length - 1] : null;

  view.innerHTML =
    '<div class="card hero">' +
      '<div class="herotop"><h1>GATE ML Practice Questions &amp; Mock Tests</h1></div>' +
      '<p class="lede">' + QUESTIONS.length + ' questions in the real GATE pattern — single-correct with negative marking, ' +
        'multiple-select, and numerical answer — across all ten topics of your study guide.</p>' +
      '<div id="warm"></div>' +
    '</div>' +

    '<div class="strip">' +
      '<div class="stat"><b>' + att + '</b><span>attempted</span></div>' +
      '<div class="stat"><b>' + acc + '%</b><span>accuracy</span></div>' +
      '<div class="stat"><b>' + wrong + '</b><span>to revisit</span></div>' +
      '<div class="stat"><b>' + bm + '</b><span>bookmarked</span></div>' +
      '<div class="stat"><b>' + (last ? last.score + "/" + last.max : "—") + '</b><span>last mock</span></div>' +
    '</div>' +

    '<div class="tiles">' +
      '<button class="tile" data-go="practice"><b>Practice by topic</b><span>Pick a topic and difficulty. The worked explanation appears the moment you answer.</span></button>' +
      '<button class="tile" data-go="mock"><b>Timed mock test</b><span>Countdown clock, question palette, negative marking, topic-wise score report.</span></button>' +
      '<button class="tile" data-go="review"><b>Review mistakes</b><span>' +
        (wrong + bm ? 'Every question you got wrong or bookmarked, collected here.' : 'Fills up automatically as you practise.') +
        '</span></button>' +
      '<button class="tile" data-go="cards"><b>Flashcards</b><span>' + CARDS.length +
        ' cards on formulas, definitions and which algorithm to reach for.</span></button>' +
    '</div>' +

    '<p class="faint" style="font-size:12.6px">' +
      (Store.ok ? 'Your progress is saved in this browser.' : 'Progress is kept for this session only — this viewer blocks storage.') +
      ' <button class="btn sm" id="reset" style="margin-left:6px">Reset progress</button></p>';

  view.querySelectorAll("[data-go]").forEach(function (b) {
    b.addEventListener("click", function () { go(b.dataset.go); });
  });
  byId("reset").addEventListener("click", function () {
    if (!confirm("Clear all progress, bookmarks and mock history?")) return;
    P = { res:{}, att:{}, bm:{}, cards:{}, mocks:[] }; save(); warmup = null; viewHome();
  });

  drawWarm();
}

function drawWarm() {
  var q = warmup, box = byId("warm");
  if (!box) return;
  var key = "w" + q.id, a = S.ans[key];
  box.innerHTML = questionHTML(q, "", "", a, { instant:true }) +
    (S.shown[q.id] ? solutionHTML(q, a) +
      '<div class="row" style="margin-top:14px"><button class="btn" id="wnext">Another question</button>' +
      '<button class="btn primary" data-go="practice">Practise properly</button></div>'
      : checkBarHTML(q, key));
  wireQuestion(box, q, key, { instant:true, after:drawWarm });
  wireCheck(box, q, key, drawWarm);
  var n = byId("wnext");
  if (n) n.addEventListener("click", function () { warmup = null; viewHome(); });
  var g = box.querySelector("[data-go]");
  if (g) g.addEventListener("click", function () { go("practice"); });
}

/* ============================================================
   Wiring shared by every question view
   ============================================================ */
function wireQuestion(box, q, key, opts) {
  opts = opts || {};
  var bm = box.querySelector("#bmBtn");
  if (bm) bm.addEventListener("click", function () {
    P.bm[q.id] = !P.bm[q.id]; save();
    bm.setAttribute("aria-pressed", P.bm[q.id] ? "true" : "false");
    bm.textContent = P.bm[q.id] ? "Bookmarked" : "Bookmark";
  });

  box.querySelectorAll("[data-opt]").forEach(function (b) {
    b.addEventListener("click", function () {
      var i = parseInt(b.dataset.opt, 10);
      if (q.type === "msq") {
        var cur = Array.isArray(S.ans[key]) ? S.ans[key].slice() : [];
        var at = cur.indexOf(i);
        if (at > -1) cur.splice(at, 1); else cur.push(i);
        S.ans[key] = cur;
      } else {
        S.ans[key] = i;
        if (opts.instant) { S.shown[q.id] = true; record(q, i); }
      }
      (opts.after || function () {})();
    });
  });

  var nat = box.querySelector("#natIn");
  if (nat) {
    nat.addEventListener("input", function () { S.ans[key] = nat.value; });
    nat.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && opts.instant) {
        S.shown[q.id] = true; record(q, nat.value); (opts.after || function () {})();
      }
    });
  }
}

/* A shared "check" button for MSQ and NAT in instant-feedback modes. */
function checkBarHTML(q, key) {
  if (S.shown[q.id]) return "";
  if (q.type === "mcq") return "";
  return '<div class="row"><button class="btn primary" id="checkBtn">Check answer</button>' +
         '<span class="kbd"><i>Enter</i></span></div>';
}
function wireCheck(box, q, key, after) {
  var c = box.querySelector("#checkBtn");
  if (c) c.addEventListener("click", function () {
    S.shown[q.id] = true; record(q, S.ans[key]); after();
  });
}
/* ============================================================
   Question palette rail
   ============================================================ */
function paletteHTML(list, cur, stateFn, extra) {
  var counts = { done:0, seen:0, mark:0, none:0 };
  var chips = list.map(function (q, i) {
    var st = stateFn(q, i);
    if (st.indexOf("mark") > -1) counts.mark++;
    else if (st.indexOf("done") > -1) counts.done++;
    else if (st.indexOf("seen") > -1) counts.seen++;
    else counts.none++;
    return '<button class="pchip ' + st + (i === cur ? " cur" : "") + '" data-jump="' + i +
           '" title="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
  }).join("");

  return '<div class="card">' +
      '<div class="railhead">Question palette</div>' +
      '<div class="pal">' + chips + '</div>' +
      '<div class="legend">' +
        '<div><span class="dot done"></span>Answered <b style="margin-left:auto">' + counts.done + '</b></div>' +
        '<div><span class="dot seen"></span>Seen, not answered <b style="margin-left:auto">' + counts.seen + '</b></div>' +
        (stateFn.marks ? '<div><span class="dot mark"></span>Marked for review <b style="margin-left:auto">' + counts.mark + '</b></div>' : '') +
        '<div><span class="dot none"></span>Not visited <b style="margin-left:auto">' + counts.none + '</b></div>' +
      '</div>' +
    '</div>' + (extra || "");
}
function wireJump(after) {
  view.querySelectorAll("[data-jump]").forEach(function (b) {
    b.addEventListener("click", function () { S.i = parseInt(b.dataset.jump, 10); after(); });
  });
}

/* ============================================================
   Practice by topic
   ============================================================ */
function practiceList() {
  return QUESTIONS.filter(function (q) {
    return (S.tf === "all" || q.t === S.tf) && (S.df === 0 || q.d === S.df);
  });
}
function viewPractice() {
  if (S.df == null) S.df = 0;
  S.list = practiceList();
  if (S.i >= S.list.length) S.i = 0;
  drawPractice();
}
function drawPractice() {
  var chips = '<div class="pick">' +
    '<button data-t="all" aria-pressed="' + (S.tf === "all") + '">All topics</button>' +
    TKEYS.map(function (k) {
      return '<button data-t="' + k + '" aria-pressed="' + (S.tf === k) + '">' + esc(TOPICS[k].n) + '</button>';
    }).join("") + '</div>' +
    '<div class="pick">' +
    [[0,"Any difficulty"],[1,"Easy"],[2,"Medium"],[3,"Hard"]].map(function (d) {
      return '<button data-d="' + d[0] + '" aria-pressed="' + (S.df === d[0]) + '">' + d[1] + '</button>';
    }).join("") + '</div>';

  if (!S.list.length) {
    view.innerHTML = chips + '<div class="card empty"><b>No questions match that combination.</b>' +
      'Try a different difficulty, or widen it to all topics.</div>';
    wirePicks();
    return;
  }

  var q = S.list[S.i], key = "p" + q.id, a = S.ans[key];
  var stateFn = function (qq) {
    if (!S.shown[qq.id]) return "";
    return P.res[qq.id] === 1 ? "done" : "seen";
  };

  view.innerHTML = chips + '<div class="shell"><div>' +
      '<div class="card qwrap" id="qbox"></div>' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="btn" id="prev"' + (S.i === 0 ? " disabled" : "") + '>Previous</button>' +
        '<button class="btn primary" id="next"' + (S.i === S.list.length - 1 ? " disabled" : "") + '>Next question</button>' +
        '<span class="kbd"><i>A</i><i>B</i><i>C</i><i>D</i> answer <i>Enter</i> check <i>N</i> next <i>F</i> flag</span>' +
      '</div>' +
    '</div>' +
    '<div class="rail">' + paletteHTML(S.list, S.i, stateFn) + '</div></div>';

  var box = byId("qbox");
  box.innerHTML = questionHTML(q, S.i + 1, S.list.length, a, { instant:true }) +
    (S.shown[q.id] ? solutionHTML(q, a) : checkBarHTML(q, key));
  wireQuestion(box, q, key, { instant:true, after:drawPractice });
  wireCheck(box, q, key, drawPractice);

  byId("prev").addEventListener("click", function () { if (S.i > 0) { S.i--; drawPractice(); } });
  byId("next").addEventListener("click", function () { if (S.i < S.list.length - 1) { S.i++; drawPractice(); } });
  wirePicks();
  wireJump(drawPractice);
}
function wirePicks() {
  view.querySelectorAll("[data-t]").forEach(function (b) {
    b.addEventListener("click", function () { S.tf = b.dataset.t; S.i = 0; viewPractice(); });
  });
  view.querySelectorAll("[data-d]").forEach(function (b) {
    b.addEventListener("click", function () { S.df = parseInt(b.dataset.d, 10); S.i = 0; viewPractice(); });
  });
}

/* ============================================================
   Timed mock test
   ============================================================ */
const PAPERS = [
  { n:20, mins:30,  t:"Quick set",        d:"20 questions in 30 minutes. Good for a daily warm-up." },
  { n:35, mins:75,  t:"Half paper",       d:"35 questions in 75 minutes. Long enough to feel the clock." },
  { n:65, mins:180, t:"Full GATE paper",  d:"65 questions in 3 hours, the real thing end to end." }
];
function viewMock() {
  if (!S.mock) return drawMockSetup();
  if (S.mock.submitted) return drawReport();
  drawMock();
}
function drawMockSetup() {
  clock.hidden = true;
  var hist = P.mocks.slice(-5).reverse();
  view.innerHTML =
    '<h2>Sit a timed paper.</h2>' +
    '<p class="lede">Questions are drawn at random across all ten topics. Single-correct questions carry ' +
      'negative marking of one third; multiple-select and numerical questions do not.</p>' +
    '<div class="tiles">' + PAPERS.map(function (p, i) {
      return '<button class="tile" data-paper="' + i + '"><b>' + p.t + '</b><span>' + p.d + '</span></button>';
    }).join("") + '</div>' +
    (hist.length ? '<div class="card" style="padding:17px 19px"><h2>Recent attempts</h2><table><thead><tr>' +
      '<th>When</th><th>Paper</th><th>Score</th><th>Accuracy</th></tr></thead><tbody>' +
      hist.map(function (m) {
        return '<tr><td>' + esc(m.when) + '</td><td>' + m.n + ' questions</td><td>' + m.score + ' / ' + m.max +
               '</td><td>' + m.acc + '%</td></tr>';
      }).join("") + '</tbody></table></div>' : "");

  view.querySelectorAll("[data-paper]").forEach(function (b) {
    b.addEventListener("click", function () { startMock(PAPERS[parseInt(b.dataset.paper, 10)]); });
  });
}
function startMock(p) {
  var n = Math.min(p.n, QUESTIONS.length);
  S.mock = { list:shuffle(QUESTIONS).slice(0, n), mins:p.mins, title:p.t,
             endsAt:Date.now() + p.mins * 60000, submitted:false, visited:{} };
  S.ans = {}; S.mark = {}; S.i = 0;
  clock.hidden = false;
  startTimer();
  drawMock();
}
function startTimer() {
  stopTimer();
  timerId = setInterval(tick, 500);
  tick();
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function tick() {
  if (!S.mock || S.mock.submitted) return stopTimer();
  var left = Math.max(0, Math.round((S.mock.endsAt - Date.now()) / 1000));
  clock.textContent = fmtTime(left);
  clock.className = "clock" + (left <= 60 ? " crit" : left <= 300 ? " warn" : "");
  if (left <= 0) { submitMock(true); }
}
function endMock() { stopTimer(); S.mock = null; clock.hidden = true; }

function drawMock() {
  var L = S.mock.list, q = L[S.i], key = "m" + q.id, a = S.ans[key];
  S.mock.visited[q.id] = true;

  var stateFn = function (qq) {
    var an = answered(S.ans["m" + qq.id]);
    if (S.mark[qq.id]) return an ? "mark done" : "mark";
    if (an) return "done";
    return S.mock.visited[qq.id] ? "seen" : "";
  };
  stateFn.marks = true;

  view.innerHTML = '<div class="shell"><div>' +
      '<div class="card qwrap" id="qbox"></div>' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="btn" id="prev"' + (S.i === 0 ? " disabled" : "") + '>Previous</button>' +
        '<button class="btn violet" id="markBtn">' + (S.mark[q.id] ? "Unmark" : "Mark for review") + ' &amp; next</button>' +
        '<button class="btn" id="clr">Clear response</button>' +
        '<button class="btn primary" id="next">Save &amp; next</button>' +
        '<span class="kbd"><i>M</i> mark <i>F</i> flag <i>Enter</i> save</span>' +
      '</div>' +
    '</div>' +
    '<div class="rail">' + paletteHTML(L, S.i, stateFn,
        '<div class="card" style="padding:14px"><button class="btn danger" id="submit" style="width:100%">Submit test</button>' +
        '<p class="faint" style="font-size:12px;margin:9px 0 0;text-align:center">' + S.mock.title + ' · ' + L.length + ' questions</p></div>') +
    '</div></div>';

  var box = byId("qbox");
  box.innerHTML = questionHTML(q, S.i + 1, L.length, a, {});
  wireQuestion(box, q, key, { after:drawMock });

  byId("prev").addEventListener("click", function () { if (S.i > 0) { S.i--; drawMock(); } });
  byId("next").addEventListener("click", nextMock);
  byId("clr").addEventListener("click", function () { delete S.ans[key]; drawMock(); });
  byId("markBtn").addEventListener("click", function () {
    S.mark[q.id] = !S.mark[q.id];
    nextMock();
  });
  byId("submit").addEventListener("click", function () { submitMock(false); });
  wireJump(drawMock);
}
function nextMock() {
  if (S.i < S.mock.list.length - 1) { S.i++; drawMock(); } else { drawMock(); }
}
function submitMock(auto) {
  var L = S.mock.list;
  if (!auto) {
    var un = L.filter(function (q) { return !answered(S.ans["m" + q.id]); }).length;
    var msg = un ? un + " question" + (un > 1 ? "s are" : " is") + " unanswered. Submit anyway?" : "Submit the test?";
    if (!confirm(msg)) return;
  }
  stopTimer();
  clock.hidden = true;
  S.mock.submitted = true;

  var score = 0, max = 0, right = 0, wrong = 0, skip = 0;
  L.forEach(function (q) {
    var a = S.ans["m" + q.id];
    max += q.m;
    score += marksFor(q, a);
    if (!answered(a)) skip++;
    else if (isCorrect(q, a)) right++;
    else wrong++;
    if (answered(a)) record(q, a);
  });
  S.mock.score = Math.round(score * 100) / 100;
  S.mock.max = max; S.mock.right = right; S.mock.wrong = wrong; S.mock.skip = skip;

  P.mocks.push({
    when: new Date().toLocaleDateString(undefined, { day:"numeric", month:"short" }),
    n: L.length, score: S.mock.score, max: max,
    acc: (right + wrong) ? Math.round(right / (right + wrong) * 100) : 0
  });
  if (P.mocks.length > 40) P.mocks = P.mocks.slice(-40);
  save();
  drawReport();
}
function drawReport() {
  var M = S.mock, L = M.list;
  var pct = M.max ? Math.round(M.score / M.max * 100) : 0;
  var byT = {};
  L.forEach(function (q) {
    var a = S.ans["m" + q.id];
    var r = byT[q.t] || (byT[q.t] = { n:0, c:0, m:0, got:0 });
    r.n++; r.m += q.m; r.got += marksFor(q, a);
    if (isCorrect(q, a)) r.c++;
  });
  var rows = Object.keys(byT).sort(function (x, y) {
    return (byT[x].c / byT[x].n) - (byT[y].c / byT[y].n);
  }).map(function (k) {
    var r = byT[k], p = Math.round(r.c / r.n * 100);
    return '<tr><td>' + esc(TOPICS[k].n) + '</td><td>' + r.c + ' / ' + r.n + '</td><td>' +
      (Math.round(r.got * 100) / 100) + ' / ' + r.m + '</td>' +
      '<td><div class="bar" style="display:inline-block;vertical-align:middle"><i style="width:' + p + '%' +
      (p < 50 ? ';background:var(--crimson)' : p < 75 ? ';background:var(--amber)' : '') + '"></i></div> ' + p + '%</td></tr>';
  }).join("");

  var lost = Math.round(L.reduce(function (s, q) {
    var a = S.ans["m" + q.id];
    return s + (answered(a) && !isCorrect(q, a) && q.type === "mcq" ? q.m / 3 : 0);
  }, 0) * 100) / 100;

  view.innerHTML =
    '<div class="card" style="padding:24px 26px;margin-bottom:18px">' +
      '<div class="score"><b>' + M.score + '</b><span>out of ' + M.max + ' &nbsp;·&nbsp; ' + pct + '%</span></div>' +
      '<p class="muted" style="margin-bottom:0">' + M.right + ' correct, ' + M.wrong + ' wrong, ' + M.skip +
      ' unattempted. Negative marking cost you ' + lost + ' mark' + (lost === 1 ? '' : 's') + '.</p>' +
    '</div>' +

    '<div class="card" style="padding:19px 22px;margin-bottom:18px">' +
      '<h2>Weakest topics first</h2>' +
      '<table><thead><tr><th>Topic</th><th>Correct</th><th>Marks</th><th>Accuracy</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
    '</div>' +

    '<div class="row">' +
      '<button class="btn primary" id="goRev">Go through the answers</button>' +
      '<button class="btn" id="again">Take another paper</button>' +
    '</div>' +
    '<div class="ad-slot ad-slot--results" data-ad-slot="results" role="complementary" aria-label="Advertisement"></div>' +
    '<p class="muted" style="font-size:12.5px">Keep going in the <a href="ml-guide.html">ML guide</a> or revise <a href="topics/">topic notes</a>.</p>';

  byId("again").addEventListener("click", function () { endMock(); S.ans = {}; drawMockSetup(); });
  byId("goRev").addEventListener("click", function () {
    S.revList = L.slice(); S.revKey = "m"; S.i = 0; S.tab = "mock"; go("review");
  });
}

/* ============================================================
   Review: mistakes, bookmarks, and the last paper
   ============================================================ */
function reviewList() {
  if (S.tab === "mock" && S.revList) return S.revList;
  if (S.tab === "bm") return QUESTIONS.filter(function (q) { return P.bm[q.id]; });
  return QUESTIONS.filter(function (q) { return P.res[q.id] === 0; });
}
function viewReview() {
  var L = reviewList();
  if (S.i >= L.length) S.i = 0;
  drawReview();
}
function drawReview() {
  var L = reviewList();
  var tabs = '<div class="pick">' +
    '<button data-tab="wrong" aria-pressed="' + (S.tab === "wrong") + '">Got wrong</button>' +
    '<button data-tab="bm" aria-pressed="' + (S.tab === "bm") + '">Bookmarked</button>' +
    (S.revList ? '<button data-tab="mock" aria-pressed="' + (S.tab === "mock") + '">Last paper</button>' : "") +
    '</div>';

  if (!L.length) {
    view.innerHTML = tabs + '<div class="card empty"><b>Nothing here yet.</b>' +
      (S.tab === "bm" ? 'Bookmark a question while practising and it will show up here.'
                      : 'Questions you answer incorrectly are collected here automatically.') + '</div>';
    wireTabs();
    return;
  }

  var q = L[S.i];
  var key = (S.tab === "mock" ? "m" : "p") + q.id;
  var a = S.ans[key];
  var stateFn = function (qq) { return P.res[qq.id] === 1 ? "done" : P.res[qq.id] === 0 ? "seen" : ""; };

  view.innerHTML = tabs + '<div class="shell"><div>' +
      '<div class="card qwrap" id="qbox"></div>' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="btn" id="prev"' + (S.i === 0 ? " disabled" : "") + '>Previous</button>' +
        '<button class="btn primary" id="next"' + (S.i === L.length - 1 ? " disabled" : "") + '>Next</button>' +
        (S.tab === "wrong" ? '<button class="btn" id="clear">Remove from this list</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="rail">' + paletteHTML(L, S.i, stateFn) + '</div></div>';

  var box = byId("qbox");
  box.innerHTML = questionHTML(q, S.i + 1, L.length, a, { locked:true }) + solutionHTML(q, a);
  wireQuestion(box, q, key, { locked:true });

  byId("prev").addEventListener("click", function () { if (S.i > 0) { S.i--; drawReview(); } });
  byId("next").addEventListener("click", function () { if (S.i < L.length - 1) { S.i++; drawReview(); } });
  var c = byId("clear");
  if (c) c.addEventListener("click", function () { delete P.res[q.id]; save(); if (S.i > 0) S.i--; drawReview(); });
  wireTabs();
  wireJump(drawReview);
}
function wireTabs() {
  view.querySelectorAll("[data-tab]").forEach(function (b) {
    b.addEventListener("click", function () { S.tab = b.dataset.tab; S.i = 0; drawReview(); });
  });
}

/* ============================================================
   Flashcards
   ============================================================ */
function viewCards() {
  if (!S.q || !S.q.length) buildCardQueue();
  drawCards();
}
function buildCardQueue() {
  var pool = CARDS.map(function (c, i) { return i; })
    .filter(function (i) { return S.cf === "all" || !S.cf || CARDS[i].t === S.cf; });
  S.q = shuffle(pool);
  S.flip = false;
}
function drawCards() {
  if (!S.cf) S.cf = "all";
  var chips = '<div class="pick">' +
    '<button data-cf="all" aria-pressed="' + (S.cf === "all") + '">All cards</button>' +
    TKEYS.map(function (k) {
      return '<button data-cf="' + k + '" aria-pressed="' + (S.cf === k) + '">' + esc(TOPICS[k].n) + '</button>';
    }).join("") + '</div>';

  if (!S.q.length) {
    view.innerHTML = chips + '<div class="card empty"><b>Deck finished.</b>Every card in this set has been cleared.' +
      '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="again">Shuffle and go again</button></div></div>';
    view.querySelectorAll("[data-cf]").forEach(function (b) {
      b.addEventListener("click", function () { S.cf = b.dataset.cf; buildCardQueue(); drawCards(); });
    });
    byId("again").addEventListener("click", function () { buildCardQueue(); drawCards(); });
    return;
  }

  var c = CARDS[S.q[0]];
  view.innerHTML = chips +
    '<div style="max-width:720px">' +
      '<div class="bigrow"><h2 style="margin:0">' + esc(TOPICS[c.t].n) + '</h2>' +
        '<span class="faint">' + S.q.length + ' left in this pass</span></div>' +
      '<div class="fc" id="card">' +
        (S.flip
          ? '<div class="side">Answer</div><div class="back">' + c.b + '</div>'
          : '<div class="side">Prompt</div><div class="front">' + c.f + '</div>' +
            '<div class="hint">Click the card or press Space to reveal</div>') +
      '</div>' +
      (S.flip
        ? '<div class="row" style="margin-top:14px"><button class="btn" id="again2">Show again later</button>' +
          '<button class="btn primary" id="got">Got it</button>' +
          '<span class="kbd"><i>1</i> again <i>2</i> got it</span></div>'
        : '<div class="row" style="margin-top:14px"><button class="btn primary" id="rev">Reveal</button>' +
          '<span class="kbd"><i>Space</i></span></div>') +
    '</div>';

  view.querySelectorAll("[data-cf]").forEach(function (b) {
    b.addEventListener("click", function () { S.cf = b.dataset.cf; buildCardQueue(); drawCards(); });
  });
  byId("card").addEventListener("click", function () { S.flip = !S.flip; drawCards(); });
  var r = byId("rev"); if (r) r.addEventListener("click", function () { S.flip = true; drawCards(); });
  var g = byId("got"); if (g) g.addEventListener("click", function () { rate(true); });
  var a2 = byId("again2"); if (a2) a2.addEventListener("click", function () { rate(false); });
}
function rate(ok) {
  var id = S.q.shift();
  P.cards[id] = (P.cards[id] || 0) + (ok ? 1 : 0);
  save();
  if (!ok) S.q.splice(Math.min(4, S.q.length), 0, id);
  S.flip = false;
  drawCards();
}

/* ============================================================
   Keyboard
   ============================================================ */
document.addEventListener("keydown", function (e) {
  var tag = (e.target.tagName || "").toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;

  if (S.mode === "cards") {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); S.flip = !S.flip; drawCards(); }
    else if (S.flip && e.key === "1") rate(false);
    else if (S.flip && e.key === "2") rate(true);
    return;
  }
  if (S.mode !== "practice" && S.mode !== "mock" && S.mode !== "review" && S.mode !== "home") return;

  var draw = S.mode === "practice" ? drawPractice : S.mode === "mock" ? drawMock : S.mode === "review" ? drawReview : drawWarm;
  var L = S.mode === "practice" ? S.list : S.mode === "mock" ? (S.mock ? S.mock.list : []) : S.mode === "review" ? reviewList() : [];
  if (S.mode === "mock" && (!S.mock || S.mock.submitted)) return;

  var k = e.key.toLowerCase();
  var idx = "abcdefgh".indexOf(k);
  if (idx === -1 && /^[1-8]$/.test(k) && !(S.mode === "cards")) idx = parseInt(k, 10) - 1;

  var q = L[S.i];
  if (!q && S.mode === "home") q = warmup;
  if (!q) return;
  var key = (S.mode === "mock" ? "m" : S.mode === "home" ? "w" : "p") + q.id;

  if (idx > -1 && q.type !== "nat" && idx < q.o.length && S.mode !== "review") {
    if (S.mode !== "mock" && S.shown[q.id]) return;
    e.preventDefault();
    var btn = view.querySelector('[data-opt="' + idx + '"]');
    if (btn && !btn.disabled) btn.click();
    return;
  }
  /* 'f' flags the question. It cannot be 'b', because b is already option B. */
  if (k === "f") { var bm = view.querySelector("#bmBtn"); if (bm) { e.preventDefault(); bm.click(); } return; }
  if (k === "m" && S.mode === "mock") { var mk = byId("markBtn"); if (mk) { e.preventDefault(); mk.click(); } return; }
  if (e.key === "Enter") {
    e.preventDefault();
    var c = byId("checkBtn") || byId("next");
    if (c && !c.disabled) c.click();
    return;
  }
  if (k === "n" || e.key === "ArrowRight") { var n = byId("next"); if (n && !n.disabled) { e.preventDefault(); n.click(); } }
  if (k === "p" || e.key === "ArrowLeft") { var p = byId("prev"); if (p && !p.disabled) { e.preventDefault(); p.click(); } }
});

window.addEventListener("beforeunload", function (e) {
  if (S.mock && !S.mock.submitted) { e.preventDefault(); e.returnValue = ""; }
});

/* ============================================================
   Boot

   Deep links, so the landing page can jump straight into a topic:
     ?t=reg          practice mode, filtered to Regression
     ?m=mock         open the mock-test setup screen
     ?t=nn&m=cards   flashcards, Neural networks
   ============================================================ */
renderModes();

(function boot() {
  var qs = {};
  (location.search || "").replace(/^\?/, "").split("&").forEach(function (part) {
    if (!part) return;
    var i = part.indexOf("=");
    var k = i < 0 ? part : part.slice(0, i);
    var v = i < 0 ? "" : part.slice(i + 1);
    try { qs[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, " ")); } catch (err) {}
  });

  var t = qs.t, m = qs.m, start = "home";
  if (t && TOPICS[t]) { S.tf = t; start = "practice"; }
  if (m && MODES.some(function (x) { return x.k === m; })) { start = m; }
  go(start);
})();
</script>

/* Practice-funnel analytics (safe: dispatches even when GA is off). */
(function () {
  function emit(n, p) { try { if (window.GateMLTrack) window.GateMLTrack(n, p || {}); } catch (e) {} }
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("button") : null;
    if (!b || !b.id) return;
    if (b.id === "startP") emit("practice_started", {});
    if (b.id === "begin") emit("practice_started", { kind: "mock" });
    if (b.id === "submit") emit("quiz_completed", { kind: "mock" });
    if (b.id === "checkBtn") emit("question_answered", {});
  });
})();
</script>
