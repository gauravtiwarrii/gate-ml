<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syllabus Tracker — GATE DA 2027 | hellogaurav.me</title><meta name="description" content="Official GATE DA 2027 syllabus tracker: 8 subjects, topic-wise status, bookmarks, notes, real progress in your browser."><link rel="canonical" href="https://hellogaurav.me/syllabus"><meta property="og:title" content="Syllabus Tracker — GATE DA 2027"><meta property="og:url" content="https://hellogaurav.me/syllabus"><link rel="stylesheet" href="../assets/seo.css"><style>body{font-family:Georgia,serif;max-width:960px;margin:0 auto;padding:24px 18px 60px;background:#0a0a0a;color:#f5f3ee;line-height:1.6}h1,h2{font-family:Arial,sans-serif}a{color:#e2601f}nav{font-family:Arial;font-size:13px;margin-bottom:16px}nav a{margin-right:12px;color:#f5f3ee}.bar{height:10px;background:#222;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#e2601f}.sub{border:1px solid #333;border-radius:12px;padding:14px;margin:12px 0;background:#111}.tp{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #222;font-size:.93rem}select,input{background:#1a1a1a;color:#eee;border:1px solid #444;border-radius:8px;padding:6px 10px}</style></head><body><nav><a href="../index.html">Home</a><a href="../dashboard">Dashboard</a><a href="../learn/calculus">Learn</a><a href="../practice-da">Practice</a><a href="../mock-da">Mocks</a><a href="../revision">Revision</a></nav><h1>GATE DA 2027 — syllabus tracker</h1><p>Source: <a href="https://gate2027.iitm.ac.in/static/doc/GATE2027_Syllabus/DA_GATE2027_Syllabus.pdf">official DA syllabus PDF (IIT Madras)</a> + <a href="https://gate2027.iitm.ac.in/question_paper_pattern">pattern</a>. 100 marks = 15 GA + 85 technical. Progress is stored only in your browser.</p><p><label>Filter: <select id="f"><option value="">All subjects</option><option value="bookmarked">Bookmarked</option><option value="weak">Weak (confidence ≤2 + attempted)</option><option value="todo">Not started / In progress</option></select></label></p><div class="bar" aria-label="Overall completion"><i id="overall" style="width:0%"></i></div><p id="pct"></p><div id="subs"></div><script src="../assets/gateda.js"></script><script>GateDALoad().then(function(d){var box=document.getElementById("subs");function stat(id){return GateDA.topicState(id)}function mastered(t){var s=stat(t.id).status;return s==="practiced"||s==="mastered"}function render(){var f=document.getElementById("f").value;box.innerHTML="";var tot=0,done=0;d.subjects.forEach(function(s){var ts=s.topics.filter(function(t){var st=stat(t.id);if(f==="bookmarked"&&!st.bookmarked)return false;if(f==="todo"&&["practiced","mastered","revision-needed"].indexOf(st.status)>=0)return false;if(f==="weak"&&!(st.confidence<=2&&st.lastStudied))return false;return true});if(!ts.length)return;var el=document.createElement("div");el.className="sub";var m=s.topics.filter(mastered).length;tot+=s.topics.length;done+=m;el.innerHTML="<h2>"+s.title+" — "+m+"/"+s.topics.length+"</h2><div class='bar'><i style='width:"+Math.round(100*m/s.topics.length)+"%'></i></div>";ts.forEach(function(t){var st=stat(t.id);var row=document.createElement("div");row.className="tp";var sel=document.createElement("select");["not-started","in-progress","practiced","revision-needed","mastered"].forEach(function(o){var op=document.createElement("option");op.value=o;op.textContent=o;if(st.status===o)op.selected=true;sel.appendChild(op)});sel.onchange=function(){GateDA.setTopic(t.id,{status:sel.value});render()};var bm=document.createElement("button");bm.textContent=st.bookmarked?"★":"☆";bm.onclick=function(){GateDA.setTopic(t.id,{bookmarked:!st.bookmarked});render()};var sp=document.createElement("span");sp.innerHTML="<b>"+t.id+"</b> — "+t.official+" ";(t.res||[]).forEach(function(r){var a=document.createElement("a");a.href=r;a.textContent=" [learn]";a.style.marginLeft="6px";sp.appendChild(a)});row.appendChild(sel);row.appendChild(bm);row.appendChild(sp);el.appendChild(row)});box.appendChild(el)});document.getElementById("overall").style.width=Math.round(100*done/Math.max(1,tot))+"%";document.getElementById("pct").textContent="Overall: "+done+"/"+tot+" topics practiced or mastered ("+Math.round(100*done/Math.max(1,tot))+"%)";}document.getElementById("f").onchange=render;render()})</script><script src="../site-config.js" defer></script><script src="../assets/seo.js" defer></script></body></html>
