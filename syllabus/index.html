<!DOCTYPE html><html lang="en" data-root=".."><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syllabus Tracker — GATE DA 2027 | hellogaurav.me</title><meta name="description" content="Official GATE DA 2027 syllabus tracker: 8 subjects, topic-wise status, bookmarks, notes, real progress in your browser."><link rel="canonical" href="https://www.hellogaurav.me/syllabus"><meta property="og:type" content="website"><meta property="og:site_name" content="GATE ML"><meta property="og:title" content="Syllabus Tracker — GATE DA 2027"><meta property="og:description" content="Official GATE DA 2027 syllabus tracker: 8 subjects, topic-wise status, bookmarks, and browser progress tracking."><meta property="og:url" content="https://www.hellogaurav.me/syllabus"><meta property="og:image" content="https://www.hellogaurav.me/assets/og-cover.svg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Syllabus Tracker — GATE DA 2027"><meta name="twitter:description" content="Official GATE DA 2027 syllabus tracker: 8 subjects, topic-wise status, bookmarks, and browser progress tracking."><meta name="twitter:image" content="https://www.hellogaurav.me/assets/og-cover.svg"><link rel="stylesheet" href="../assets/seo.css"><link rel="stylesheet" href="../assets/app.css"></head><body>
<main class="app-main" id="main">
  <div class="shell">
    <div class="page-head">
      <p class="eyebrow">Syllabus</p>
      <h1>GATE DA 2027 syllabus tracker</h1>
      <p class="lede">Mapped from the <a class="link" href="https://gate2027.iitm.ac.in/static/doc/GATE2027_Syllabus/DA_GATE2027_Syllabus.pdf">official DA syllabus PDF (IIT Madras)</a> and the <a class="link" href="https://gate2027.iitm.ac.in/question_paper_pattern">exam pattern</a>. 100 marks = 15 GA + 85 technical. Progress is stored only in your browser.</p>
    </div>

    <div class="controls">
      <label class="field">Filter
        <select id="f">
          <option value="">All subjects</option>
          <option value="bookmarked">Bookmarked</option>
          <option value="weak">Weak (confidence ≤2 + attempted)</option>
          <option value="todo">Not started / In progress</option>
        </select>
      </label>
      <label class="field">Search
        <input type="search" id="q" placeholder="topic or id…">
      </label>
      <span class="muted" id="count" style="margin-left:auto"></span>
    </div>

    <div class="card" style="margin-bottom:24px">
      <div class="row" style="justify-content:space-between">
        <strong id="pct">Overall completion</strong>
        <span class="mono muted" id="pctnum">0%</span>
      </div>
      <div class="bar bar--tall" style="margin-top:10px" role="progressbar" aria-label="Overall syllabus completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="overallwrap"><i id="overall" style="width:0%"></i></div>
      <div class="legend" style="margin:12px 0 0">
        <span><span class="pill pill--ok">mastered</span> done</span>
        <span><span class="pill pill--warn">revision-needed</span> revisit</span>
        <span><span class="pill">not-started</span> to do</span>
      </div>
    </div>

    <div id="subs"></div>
  </div>
</main>
<script src="../assets/gateda.js"></script>
<script src="../assets/app-shell.js" defer></script>
<script>GateDALoad().then(function(d){var box=document.getElementById("subs");function stat(id){return GateDA.topicState(id)}function mastered(t){var s=stat(t.id).status;return s==="practiced"||s==="mastered"}function pillClass(st){return st==="mastered"||st==="practiced"?"pill--ok":st==="revision-needed"?"pill--warn":st==="in-progress"?"pill--info":"pill"}function render(){var f=document.getElementById("f").value;var q=document.getElementById("q").value.toLowerCase().trim();box.innerHTML="";var tot=0,done=0,shown=0;d.subjects.forEach(function(s){var ts=s.topics.filter(function(t){var st=stat(t.id);if(f==="bookmarked"&&!st.bookmarked)return false;if(f==="todo"&&["practiced","mastered","revision-needed"].indexOf(st.status)>=0)return false;if(f==="weak"&&!(st.confidence<=2&&st.lastStudied))return false;if(q&&(t.id.toLowerCase().indexOf(q)<0&&t.official.toLowerCase().indexOf(q)<0))return false;return true});if(!ts.length)return;var el=document.createElement("div");el.className="sub";var m=s.topics.filter(mastered).length;tot+=s.topics.length;done+=m;var spct=Math.round(100*m/s.topics.length);el.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">'+s.title+'</h2><span class="mono muted">'+m+'/'+s.topics.length+' · '+spct+'%</span></div><div class="bar"><i style="width:'+spct+'%"></i></div>';shown+=ts.length;ts.forEach(function(t){var st=stat(t.id);var row=document.createElement("div");row.className="tp";var sel=document.createElement("select");["not-started","in-progress","practiced","revision-needed","mastered"].forEach(function(o){var op=document.createElement("option");op.value=o;op.textContent=o;if(st.status===o)op.selected=true;sel.appendChild(op)});sel.onchange=function(){GateDA.setTopic(t.id,{status:sel.value});render()};var bm=document.createElement("button");bm.type="button";bm.className="star"+(st.bookmarked?" on":"");bm.textContent=st.bookmarked?"★":"☆";bm.setAttribute("aria-label","Bookmark topic");bm.onclick=function(){GateDA.setTopic(t.id,{bookmarked:!st.bookmarked});render()};var sp=document.createElement("span");sp.innerHTML='<span class="pill '+pillClass(st.status)+'">'+st.status+'</span> <span class="t-id">'+t.id+'</span> '+t.official+" ";(t.res||[]).forEach(function(r){var a=document.createElement("a");a.className="link";a.href=r;a.textContent="learn";a.style.marginLeft="6px";sp.appendChild(a)});row.appendChild(sel);row.appendChild(bm);row.appendChild(sp);el.appendChild(row)});box.appendChild(el)});var pct=Math.round(100*done/Math.max(1,tot));document.getElementById("overall").style.width=pct+"%";document.getElementById("pctnum").textContent=pct+"%";document.getElementById("overallwrap").setAttribute("aria-valuenow",pct);document.getElementById("pct").textContent="Overall: "+done+"/"+tot+" topics practiced or mastered ("+pct+"%)";document.getElementById("count").textContent=shown+" topics shown";}document.getElementById("f").onchange=render;document.getElementById("q").oninput=render;render()})</script>
<script src="../site-config.js" defer></script>
<script src="../assets/seo.js" defer></script>
</body></html>
